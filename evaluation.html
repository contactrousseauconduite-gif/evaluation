<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22416D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Évaluation de départ | Rousseau Conduite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5;--surface:#FFFFFF;--ink:#1C2B40;--muted:#5A6B7C;--line:#D2DDE3;--chip:#E2EBEF;
  --navy:#22416D;--navy-ink:#FFFFFF;--teal:#2A9DAE;--green:#8CC89F;--tealtext:#23798A;
  --F:#C9573C;--S:#2A8FA0;--B:#3E9A62;
  --display:"Montserrat","Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}}
:root[data-theme="dark"]{
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--green))}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:1rem;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b{color:#fff}}
:root[data-theme="dark"] .brand b{color:#fff}
.brand span{font-size:.82rem;color:var(--tealtext);font-weight:700}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.block h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:10px;line-height:1.2;color:var(--ink)}
.block h2 .n{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-size:.85rem;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f,.lab{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:700}
.lab{margin:0 0 6px}
input[type=text],input[type=date],input[type=tel],input[type=number],textarea{
  width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:1rem;color:var(--ink)}
.group{margin-top:14px}
.group:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:.9rem;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.seg.multi button[aria-pressed="true"]::before{content:"✓ "}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row .q{font-weight:700}
.row .seg{flex:none;flex-wrap:nowrap}

.checks button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;font-size:.95rem}
.checks button:first-child{border-top:0;padding-top:0}
.checks.att{padding:10px 0}.checks.att+.checks.att{border-top:2px solid var(--line)}.checks.att .box{border-radius:50%}
.checks .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.95rem}
.checks button[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}
.checks button[aria-pressed="true"] .box::before{content:"✓"}

.legend{font-size:.8rem;color:var(--muted);margin:-6px 0 10px}
.group .legend{margin:-2px 0 8px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
details.help{font-size:.84rem;color:var(--muted);margin:-4px 0 8px}
details.help summary{cursor:pointer;color:var(--tealtext);font-weight:700;width:max-content}
details.help ul{margin:6px 0 0;padding-left:0;list-style:none}
details.help li{margin:3px 0}
details.help li b{display:inline-block;min-width:1.8rem;color:var(--ink)}
.block h2 .part{margin-left:auto;font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--tealtext);white-space:nowrap}
.cat{font-weight:700;margin-top:8px;color:var(--green)}
.fsb{display:grid;grid-template-columns:repeat(3,48px);gap:6px;flex:none}
.fsb button{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-family:var(--display);font-weight:700;cursor:pointer}
.fsb button[aria-pressed="true"]{color:#fff;border-color:transparent}
.fsb button[data-v="F"][aria-pressed="true"],.fsb button[data-v="F2"][aria-pressed="true"]{background:var(--F)}
.fsb button[data-v="F1"][aria-pressed="true"]{background:#C98A1E}
.fsb button[data-v="F3"][aria-pressed="true"]{background:#9E3324}
.fsb4{grid-template-columns:repeat(4,48px)}
.fsb button[data-v="S"][aria-pressed="true"]{background:var(--S)}
.fsb button[data-v="B"][aria-pressed="true"]{background:var(--B)}

/* Panneau résultat */
.sign{background:var(--navy);color:#fff;border-radius:16px;padding:6px;margin:0 0 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sign{background:#22416D}}
:root[data-theme="dark"] .sign{background:#22416D}
.sign-in{border:3px solid #fff;border-radius:11px;padding:14px 14px 12px;text-align:center}
.sign h2{font-family:var(--display);font-weight:700;font-size:1rem;margin:0 0 10px;display:flex;justify-content:center;align-items:center;gap:8px}
.sign h2 .n{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;color:#22416D;font-size:.8rem}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.eq .c{display:flex;flex-direction:column;align-items:center;min-width:64px}
.eq .c small{font-size:.75rem;opacity:.85}
.eq .c b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.eq .op{font-family:var(--display);font-size:1.6rem;font-weight:700;opacity:.7;padding-bottom:4px}
.eq .c.final b{color:var(--green);font-size:2.4rem}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.prat .lbl{font-weight:700;font-size:.9rem;opacity:.92}
.hours{display:flex;align-items:center;justify-content:center;gap:18px;margin:2px 0}
.num{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:1.6rem;margin-left:3px}
.step{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;font-weight:700}
.step:disabled{opacity:.35;cursor:default}
.meta{font-size:.88rem;opacity:.95}
.reset{background:none;border:0;color:#fff;text-decoration:underline;font-size:.86rem;cursor:pointer;margin-top:4px}
.fine{font-size:.8rem;color:var(--muted);margin:6px 0 0;font-style:italic}

.pad-wrap{margin-top:12px}
.pad-head{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.pad-head button{background:none;border:0;color:var(--tealtext);font-weight:700;cursor:pointer;padding:4px}
canvas.pad{display:block;width:100%;height:130px;background:#fff;border:1px dashed #9AA9B6;border-radius:10px;touch-action:none}

details.bareme{margin-top:12px;font-size:.88rem;color:var(--muted)}
details.bareme summary{cursor:pointer;font-weight:700;color:var(--tealtext)}
details.bareme ul{margin:8px 0 0;padding-left:18px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 10px;font-weight:700;cursor:pointer;min-height:50px}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);grid-column:1/-1;font-size:1.05rem}
.btn.quiet{background:transparent}

.hist-empty{text-align:center;color:var(--muted);padding:40px 12px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.card .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:.85rem;color:var(--muted)}
.card .h{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--tealtext);min-width:3.2rem;text-align:right}
.card .del{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px 8px}
.src{font-size:.8rem;color:var(--muted);text-align:center;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (max-width:400px){.grid{grid-template-columns:1fr}.fsb{grid-template-columns:repeat(3,42px)}.row{align-items:flex-start;flex-direction:column}.row .fsb{align-self:stretch;grid-template-columns:repeat(3,1fr)}.row .fsb4{grid-template-columns:repeat(4,1fr)}}

.apps{max-width:760px;margin:0 auto;padding:6px 16px 8px;display:flex;gap:6px}
.apps a{flex:1;text-align:center;padding:7px 8px;border-radius:999px;font-weight:700;font-size:.86rem;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.apps a[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}

.bk{background:#FFF4D6;border:1px solid #E9B949;color:#4A3800;border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bk-txt{display:flex;flex-direction:column;gap:2px;font-size:.9rem;flex:1 1 220px}
.bk-act{display:flex;gap:8px;flex-wrap:wrap}.bk .btn{min-height:42px;padding:9px 12px;font-size:.9rem}
.bk .btn[data-bk-now]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}.bk .btn.quiet{color:#4A3800;border-color:#E9B949}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root:not([data-theme="light"]) .bk .btn.quiet{color:#F7E3A6}}
:root[data-theme="dark"] .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root[data-theme="dark"] .bk .btn.quiet{color:#F7E3A6}
.src small{display:block;margin-top:4px}

.pick{margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.pick.on{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--chip);border:0;border-radius:12px;padding:10px 12px}
.pick-res{display:flex;flex-direction:column;gap:6px;margin-top:8px}.pick-res:empty{display:none}
.pick-res button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.pick-res small{color:var(--muted)}
.pick-hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.linkbtn{background:none;border:0;color:var(--tealtext);font-weight:700;cursor:pointer;padding:6px 0;font-size:.9rem}
input[type=search]{width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink)}

.apps a.homeb{flex:0 0 auto;display:grid;place-items:center;padding:6px 12px}
.homelink{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}

.shm{position:fixed;inset:0;z-index:30;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.shm{align-items:center}}
.shm-in{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.shm-in{border-radius:18px}}
.shm-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.shm-h b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.shm-x{background:var(--chip);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;color:var(--ink)}
.shm-fields:empty{display:none}
.shm-tu button,.shm-tpl button{flex:1}
.shm-text{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:.95rem;line-height:1.45;color:var(--ink);resize:vertical;min-height:200px}
.shm-note{margin:-4px 0 0;font-size:.78rem;color:var(--muted)}
.shm-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shm-act .btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.shm-act .btn.primary{grid-column:1/-1;background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

.shm input{width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);min-height:44px}
.shm-fields label:last-child:nth-child(odd){grid-column:1/-1}
.apps a{white-space:nowrap}
@media (max-width:440px){.apps{gap:5px}.apps a{font-size:.8rem;padding:7px 4px}.apps a.homeb{padding:6px 10px}}

/* barre de suivi */
.jump{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:8px}
.jsc{flex:none;display:flex;align-items:baseline;gap:5px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:.95rem;border:0;cursor:pointer}
.jsc small{font-weight:700;opacity:.85;font-size:.72rem;font-family:var(--body)}
.jlinks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.jlinks::-webkit-scrollbar{display:none}
.jlinks a{flex:none;font-size:.8rem;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface)}
.jlinks a.on{color:var(--navy-ink);background:var(--tealtext);border-color:var(--tealtext)}
.save-b{flex:none;border-radius:999px;padding:6px 11px;font-weight:700;font-size:.78rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.save-b.no{background:#FFF4D6;color:#5C4300;border:1px solid #E9B949}
.save-b.ok{background:#E3F3E8;color:#23603A;border:1px solid #9FD2B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .save-b.no{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root:not([data-theme="light"]) .save-b.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}}
:root[data-theme="dark"] .save-b.no{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root[data-theme="dark"] .save-b.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}
html{scroll-padding-top:calc(var(--hh,150px) + 8px)!important}
@media (max-width:440px){.jump{gap:6px}.save-b{padding:6px 9px}}
/* informations complémentaires */
details.more{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--tealtext);list-style-position:inside}
details.more summary small{color:var(--muted);font-weight:400;margin-left:4px}
details.more[open]{padding-bottom:12px}
/* tablette en largeur : deux colonnes */
@media (min-width:1000px){
  main.wide,.bar-in,.apps,.jump{max-width:1240px}
  #viewForm{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  .fr{position:sticky;top:calc(var(--hh,150px) + 8px);max-height:calc(100vh - var(--hh,150px) - 16px);overflow:auto;padding:0 4px 8px;overscroll-behavior:contain}
  .fr .actions{grid-template-columns:1fr 1fr}
}
/* fenêtre « quitter la fiche » */
.lv-in .btn{width:100%}
</style>
</head>

<div id="viewForm"></div><div id="viewHist" hidden></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Rousseau Conduite : données communes (élèves, sauvegarde) */
window.RC=(function(){
  const K={ev:'rc-eval:history',ex:'rc-exam:history',el:'rc:eleves',last:'rc:lastBackup',snooze:'rc:backupSnooze'};
  const DAY=864e5,LIMIT=7;
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const list=k=>{try{return JSON.parse(get(k))||[]}catch(e){return[]}};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
  const fr=ts=>{const[y,m,d]=iso(ts).split('-');return `${d}/${m}/${y}`};
  let toast=()=>{};

  /* ---------- élèves ---------- */
  const FIELDS=['nom','prenom','naissance','tel','adresse','cp','ville','niveau','profession','nationalite','boite'];
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const keyOf=o=>norm(o.nom)+'|'+norm(o.prenom);
  const full=e=>[e.prenom,e.nom].filter(Boolean).join(' ')||'Sans nom';
  const eleves=()=>list(K.el);
  const saveEleves=l=>set(K.el,JSON.stringify(l));
  const eleve=id=>id?eleves().find(e=>e.id===id)||null:null;
  const newId=()=>'el'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function link(rec){
    if(!rec.nom&&!rec.prenom)return rec.eleveId||null;
    const l=eleves();let e=rec.eleveId&&l.find(x=>x.id===rec.eleveId);
    if(!e)e=l.find(x=>keyOf(x)===keyOf(rec));
    if(!e){e={id:newId(),createdAt:Date.now(),notes:''};l.push(e)}
    FIELDS.forEach(f=>{if(rec[f]!=null&&rec[f]!=='')e[f]=rec[f]});
    e.updatedAt=Date.now();saveEleves(l);return e.id}
  function addEleve(o){const l=eleves(),e=Object.assign({id:newId(),createdAt:Date.now(),updatedAt:Date.now(),notes:''},o);l.push(e);saveEleves(l);return e}
  function updateEleve(id,patch){const l=eleves(),e=l.find(x=>x.id===id);if(!e)return;Object.assign(e,patch,{updatedAt:Date.now()});saveEleves(l);
    /* garder les noms des fiches à jour */
    [K.ev,K.ex].forEach(k=>{const r=list(k);let ch=false;r.forEach(x=>{if(x.eleveId===id){['nom','prenom'].forEach(f=>{if(patch[f]!=null&&x[f]!==patch[f]){x[f]=patch[f];ch=true}})}});if(ch)set(k,JSON.stringify(r))})}
  function deleteEleve(id){saveEleves(eleves().filter(e=>e.id!==id));
    [K.ev,K.ex].forEach(k=>set(k,JSON.stringify(list(k).filter(x=>x.eleveId!==id))))}
  function syncAll(){[K.ev,K.ex].forEach(k=>{const recs=list(k);let ch=false;
    [...recs].sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0)).forEach(r=>{if(!r.eleveId&&(r.nom||r.prenom)){r.eleveId=link(r);ch=true}});
    if(ch)set(k,JSON.stringify(recs))})}
  const recordsOf=id=>({ev:list(K.ev).filter(x=>x.eleveId===id),ex:list(K.ex).filter(x=>x.eleveId===id)});

  /* sélecteur d'élève dans les fiches */
  let onPick=null,onClear=null;
  function pickerHTML(id){const e=eleve(id);
    if(e)return `<div class="pick on"><span>Dossier de <b>${esc(full(e))}</b></span><button type="button" class="linkbtn" data-eleve-clear>Changer d’élève</button></div>`;
    if(!eleves().length)return `<p class="pick-hint">Nouvel élève : son dossier sera créé à l’enregistrement.</p>`;
    return `<div class="pick"><label class="f">Élève déjà suivi ?<input type="search" data-eleve-search placeholder="Rechercher par nom ou prénom" autocomplete="off"></label>
      <div class="pick-res" data-eleve-results></div><p class="pick-hint">Nouvel élève ? Remplissez la fiche, son dossier sera créé à l’enregistrement.</p></div>`}
  function results(q){const n=norm(q);let l=eleves();
    l=n?l.filter(e=>norm(full(e)+' '+full({prenom:e.nom,nom:e.prenom})).includes(n)):l.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    return l.slice(0,6).map(e=>`<button type="button" data-eleve-pick="${esc(e.id)}"><b>${esc(full(e))}</b>${e.tel?`<small>${esc(e.tel)}</small>`:''}</button>`).join('')||'<p class="pick-hint">Aucun élève trouvé.</p>'}
  const showRes=inp=>{const box=inp.closest('.pick').querySelector('[data-eleve-results]');box.innerHTML=results(inp.value)};
  document.addEventListener('input',e=>{if(e.target.matches('[data-eleve-search]'))showRes(e.target)});
  document.addEventListener('focusin',e=>{if(e.target.matches('[data-eleve-search]'))showRes(e.target)});

  /* ---------- sauvegarde ---------- */
  function saveFile(name,data){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  function status(){const n=list(K.ev).length+list(K.ex).length,last=+get(K.last)||0;
    return{n,last,days:last?Math.floor((Date.now()-last)/DAY):null}}
  function lastText(){const s=status();return s.last?`Dernière sauvegarde le ${fr(s.last)}.`:'Aucune sauvegarde faite pour l’instant.'}
  function backup(){const ev=list(K.ev),ex=list(K.ex),el=eleves();
    if(!ev.length&&!ex.length&&!el.length){toast('Aucune fiche à sauvegarder');return}
    saveFile(`sauvegarde-rousseau-conduite-${iso(Date.now())}.json`,JSON.stringify({app:'rousseau-conduite',v:4,date:Date.now(),eleves:el,evaluations:ev,examens:ex}));
    set(K.last,String(Date.now()));check();
    toast(`Sauvegarde téléchargée : ${el.length} élève${el.length>1?'s':''}, ${ev.length+ex.length} fiche${ev.length+ex.length>1?'s':''}`)}
  function mergeInto(k,items,ok){const byId=Object.fromEntries(list(k).map(x=>[x.id,x]));let n=0;
    (items||[]).filter(x=>x&&x.id&&ok(x)).forEach(x=>{n++;if(!byId[x.id]||(x.updatedAt||0)>(byId[x.id].updatedAt||0))byId[x.id]=x});
    if(n)set(k,JSON.stringify(Object.values(byId)));return n}
  async function restore(file){
    try{const d=JSON.parse(await file.text());
      const el=mergeInto(K.el,d.eleves,()=>true),ev=mergeInto(K.ev,d.evaluations,x=>x.v===2),ex=mergeInto(K.ex,d.examens,x=>x.v===1);
      if(!el&&!ev&&!ex)throw 0;syncAll();
      toast(`Restauré : ${ev} évaluation${ev>1?'s':''}, ${ex} examen${ex>1?'s':''} blanc${ex>1?'s':''}`);check();return true}
    catch(e){toast('Fichier de sauvegarde non reconnu');return false}}
  function check(){const el=document.getElementById('bkBanner');if(!el)return;const s=status();
    const due=s.n>0&&(!s.last||s.days>=LIMIT)&&Date.now()>(+get(K.snooze)||0);
    el.hidden=!due;
    if(due)el.querySelector('[data-bk-txt]').textContent=s.last?`Votre dernière sauvegarde date de ${s.days} jours.`:`Vous avez ${s.n} fiche${s.n>1?'s':''} enregistrée${s.n>1?'s':''} et aucune sauvegarde.`;
    document.querySelectorAll('[data-bk-last]').forEach(x=>x.textContent=lastText())}
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-bk-now]'))backup();
    if(e.target.closest('[data-bk-later]')){set(K.snooze,String(Date.now()+DAY));check()}
    const p=e.target.closest('[data-eleve-pick]');if(p&&onPick){const x=eleve(p.dataset.elevePick);if(x)onPick(x)}
    if(e.target.closest('[data-eleve-clear]')&&onClear)onClear();
  });

  /* ---------- partage de messages et de documents ---------- */
  const T=(tu,a,b)=>tu?a:b;
  function copyText(t){return navigator.clipboard?navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t)):Promise.resolve(fallbackCopy(t))}
  function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
  async function shareText(title,text){
    if(navigator.share){try{await navigator.share({title,text});return}catch(e){if(e&&e.name==='AbortError')return}}
    toast(await copyText(text)?'Message copié : collez-le dans votre messagerie':'Partage impossible ici')}
  async function shareFile(url,name,title){
    try{if(navigator.canShare){const blob=await (await fetch(url)).blob();const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return}}}
    catch(e){if(e&&e.name==='AbortError')return}
    window.open(url,'_blank')}
  let shm=null;
  function openShare(o){
    closeShare();let tpl=o.templates[0],tu=(get('rc:tu')||'tu')==='tu',edited=false;
    const el=document.createElement('div');el.className='shm';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',o.title);
    const fieldsHTML=t=>(t.fields||[]).map(f=>`<label class="f">${esc(f.label)}<input type="${f.type||'text'}" data-shm-f="${f.k}" value="${esc(f.value||'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></label>`).join('');
    el.innerHTML=`<div class="shm-in"><div class="shm-h"><b>${esc(o.title)}</b><button type="button" class="shm-x" data-shm-close aria-label="Fermer">✕</button></div>
      ${o.templates.length>1?`<div class="seg shm-tpl">${o.templates.map(t=>`<button type="button" data-shm-tpl="${t.id}" aria-pressed="${t===tpl}">${esc(t.label)}</button>`).join('')}</div>`:''}
      <div class="shm-fields grid"></div>
      <div class="seg shm-tu"><button type="button" data-shm-tu="tu">Tutoiement</button><button type="button" data-shm-tu="vous">Vouvoiement</button></div>
      <textarea class="shm-text" rows="11"></textarea><p class="shm-note">Vous pouvez modifier le texte avant de l’envoyer.</p>
      <div class="shm-act"><button type="button" class="btn primary" data-shm-share>Partager</button>${o.tel?`<a class="btn" data-shm-sms href="#">Envoyer par SMS</a>`:''}<button type="button" class="btn" data-shm-copy>Copier</button></div></div>`;
    document.body.appendChild(el);shm=el;document.documentElement.style.overflow='hidden';
    const ta=el.querySelector('.shm-text');
    const vals=()=>Object.fromEntries([...el.querySelectorAll('[data-shm-f]')].map(i=>[i.dataset.shmF,i.value]));
    const sms=()=>{const a=el.querySelector('[data-shm-sms]');if(a)a.href=`sms:${o.tel.replace(/\s/g,'')}?body=${encodeURIComponent(ta.value)}`};
    const regen=()=>{ta.value=tpl.build(tu,vals());edited=false;sms()};
    const paint=()=>{el.querySelector('.shm-fields').innerHTML=fieldsHTML(tpl);el.querySelectorAll('[data-shm-tu]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.shmTu==='tu')===tu));regen()};
    paint();
    el.addEventListener('input',e=>{if(e.target===ta){edited=true;sms()}else if(e.target.dataset.shmF!=null)regen()});
    el.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(e.target===el){closeShare();return}if(!b)return;
      if(b.dataset.shmClose!=null)closeShare();
      else if(b.dataset.shmTu){if(edited&&!confirm('Refaire le message ? Vos modifications seront perdues.'))return;tu=b.dataset.shmTu==='tu';set('rc:tu',tu?'tu':'vous');paint()}
      else if(b.dataset.shmTpl){if(edited&&!confirm('Changer de message ? Vos modifications seront perdues.'))return;tpl=o.templates.find(t=>t.id===b.dataset.shmTpl);el.querySelectorAll('[data-shm-tpl]').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()}
      else if(b.dataset.shmShare!=null)shareText(o.title,ta.value);
      else if(b.dataset.shmCopy!=null)toast(await copyText(ta.value)?'Message copié':'Copie impossible ici');
    });
    el.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare()});
    setTimeout(()=>el.querySelector('.shm-x').focus(),50);
  }
  function closeShare(){if(shm){shm.remove();shm=null;document.documentElement.style.overflow=''}}
  const DOCS=[{url:'memo-verifications-premiers-secours.pdf',title:'Mémo vérifications et premiers secours',sub:'2 pages, l’essentiel à retenir'},
    {url:'les-100-questions.pdf',title:'Les 100 questions de vérification',sub:'11 pages, toutes les séries avec leurs réponses'},
    {url:'vos-donnees-personnelles.pdf',title:'Vos données personnelles',sub:'1 page, à remettre à l’élève lors de l’évaluation de départ'}];
  syncAll();
  return{backup,restore,check,lastText,setToast:f=>{toast=f},
    eleves,eleve,link,addEleve,updateEleve,deleteEleve,recordsOf,full,norm,fr,FIELDS,pickerHTML,
    setPicker:(p,c)=>{onPick=p;onClear=c},T,openShare,shareText,shareFile,DOCS,frDate:iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}};
})();
</script>

 compr:[['B','Une seule explication ou démonstration a suffi'],['S','Il en a fallu deux'],['F','Il en a fallu trois ou plus']],
 mem:[['B','Cite dans l’ordre les 5 opérations pour démarrer et les 5 pour s’arrêter, sans erreur'],['S','Une ou deux erreurs'],['F','Plus de deux erreurs']],
 traj:[['B','Trajectoire précise en ligne droite et en courbe, distances latérales respectées'],['S','Hésitante dans les courbes, petits écarts vite corrigés'],['F','Écarts importants, distances latérales mal évaluées']],
 obs:[['B','Repère les indices importants'],['S','Oublie un indice important'],['F','Oublie plusieurs indices importants']],
 orient:[['B','Aucune erreur de direction'],['S','Une erreur de direction'],['F','Plusieurs erreurs (un clignotant oublié ou inversé compte comme une erreur)']],
 regard:[['B','Regarde loin, regard mobile, annonce tôt les indices, regarde sur les côtés aux intersections'],['F1','Regarde loin mais regard fixe, ne regarde pas sur les côtés aux intersections'],['F2','Ne regarde pas loin mais regard mobile, annonce tard, regarde sur les côtés'],['F3','Ni loin ni mobile, annonce tard, ne regarde pas sur les côtés']],
 gen:[['B','Réactions visibles au début qui s’atténuent ensuite'],['S','Aucune réaction visible'],['F','Réactions qui persistent ou augmentent']],
 crisp:[['B','Aucune crispation'],['S','Crispation qui s’atténue'],['F','Crispation forte et persistante']]
};
const help=k=>HELP[k]?`<details class="help"><summary>Critères</summary><ul>${HELP[k].map(([l,t])=>`<li><b>${l}</b> ${t}</li>`).join('')}</ul></details>`:'';
/* Barème de la fiche école */
const PTS_PERMIS={B1:1,AM:2,A1:2,A2:2,A:2},PTS_COND={'Jamais':0,'Moins de 5 h':1,'Plus de 5 h':2},
 PTS_AVEC={'Amis':-1,'Parents':1,'Auto-école':2},PTS_OU={'Ville':-2,'Route':-1,'Chemin':0},
 PTS_SINON={'Vélo':0,'Cyclo':1,'Quadricycle à moteur':1,'Moto':2,'Autre véhicule':1},
 PTS_FSB={inst:{F:-2,S:0,B:2},dem:{F:-3,S:0,B:2},vol:{F:-2,S:0,B:2},compr:{F:-1,S:0,B:1},mem:{F:-1,S:0,B:1},
  traj:{F:-4,S:0,B:3},obs:{F:-1,S:0,B:1},orient:{F:-1,S:0,B:1},gen:{F:-1,S:0,B:1},crisp:{F:-1,S:0,B:1}},
 PTS_REG={B:2,F1:-1,F2:-2,F3:-3};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const newId=()=>'ev'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const frDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a[k]=a[k]||{};a=a[k]});a[ks[ks.length-1]]=v};

function pro(){try{return JSON.parse(lsGet(LS_PRO))||{}}catch(e){return{}}}
function blank(){const p=pro();return{v:2,id:newId(),createdAt:Date.now(),updatedAt:Date.now(),date:todayISO(),
  nom:'',prenom:'',naissance:'',adresse:'',cp:'',ville:'',tel:'',niveau:'',profession:'',nationalite:'',oeilD:'',oeilG:'',correction:null,incompat:'',visite:null,
  boite:'manuelle',permis:null,permisDate:'',conduite:null,avecQui:null,ou:null,sinon:[],
  veh:{},att1:null,att2:null,fsb:{},regard:null,
  theorie:'',pratique:null,acceptee:null,retTheo:'',retPrat:'',
  formateur:p.formateur||'',autorisation:p.autorisation||'',sig:{formateur:null,eleve:null,parents:null}}}
function normalize(o){const b=blank();const r=Object.assign(b,o||{});['veh','fsb'].forEach(k=>r[k]=r[k]||{});r.sinon=Array.isArray(r.sinon)?r.sinon:[];['permis','avecQui','ou'].forEach(k=>{if(Array.isArray(r[k]))r[k]=r[k].length?r[k][r[k].length-1]:null});
  r.sig=Object.assign({formateur:null,eleve:null,parents:null},r.sig||{});return r}

let S;try{S=JSON.parse(lsGet(LS_DRAFT))}catch(e){S=null}
S=(S&&S.v===2)?normalize(S):blank();

/* ---------- calcul ---------- */
function compute(){
  let pos=0,neg=0,ans=0,tot=0;const parts={};
  const add=(p,s)=>{parts[s]=parts[s]||{p:0,n:0,a:false};parts[s].a=true;if(p>0){pos+=p;parts[s].p+=p}else{neg+=-p;parts[s].n+=-p}};
  if(S.permis)add(PTS_PERMIS[S.permis]||0,2);
  tot++;if(S.conduite){ans++;add(PTS_COND[S.conduite],2)}
  const drove=!!S.conduite&&S.conduite!=='Jamais';
  if(drove){tot++;if(S.avecQui){ans++;add(PTS_AVEC[S.avecQui],2)}
    if(S.avecQui!=='Auto-école'){tot++;if(S.ou){ans++;add(PTS_OU[S.ou],2)}}}
  if(S.conduite==='Jamais')S.sinon.forEach(v=>add(PTS_SINON[v]||0,2));
  VEH.forEach(([k])=>{tot++;if(S.veh[k]){ans++;add(S.veh[k]==='Oui'?1:0,3)}});
  ATT.forEach(([k,opts])=>{tot++;const o=opts.find(x=>x[0]===S[k]);if(o){ans++;add(o[2],4)}});
  Object.values(FSB).forEach(g=>g.items.forEach(([k])=>{tot++;if(S.fsb[k]){ans++;add(PTS_FSB[k][S.fsb[k]],g.n)}}));
  tot++;if(S.regard){ans++;add(PTS_REG[S.regard],7)}
  const res=pos-neg;
  const cat=res>12?'bon':res>=-12?'satisfaisant':'faible';
  const theo=cat==='faible'?13:cat==='satisfaisant'?10:null;
  return{pos,neg,res,ans,tot,parts,est:ans?Math.max(MIN_PRAT,cat==='faible'?27:20):null,min:MIN_PRAT,cat,theo};
}
const pratique=c=>{const v=S.pratique??c.est;return v==null?null:Math.max(MIN_PRAT,v)};
function age(){if(!S.naissance)return null;const b=new Date(S.naissance),d=S.date?new Date(S.date):new Date();let a=d.getFullYear()-b.getFullYear();
  const m=d.getMonth()-b.getMonth();if(m<0||(m===0&&d.getDate()<b.getDate()))a--;return a}
const minor=()=>{const a=age();return a!=null&&a<18};
function retenue(c){return S.acceptee==='Oui'?{t:S.theorie,p:pratique(c)}:{t:S.retTheo,p:S.retPrat===''||S.retPrat==null?S.retPrat:Math.max(MIN_PRAT,+S.retPrat)}}

/* ---------- rendu ---------- */
const inp=(k,l,type='text',cls='',extra='')=>`<label class="f ${cls}">${l}<input type="${type}" data-in="${k}" value="${esc(S[k])}" ${extra}></label>`;
const single=(path,opts,cls='seg')=>`<div class="${cls}" data-single="${path}">${opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${getP(S,path)===o}">${esc(o)}</button>`).join('')}</div>`;
const multi=(k,opts)=>`<div class="seg multi" data-multi="${k}">${opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${S[k].includes(o)}">${esc(o)}</button>`).join('')}</div>`;
const pad=(k,l,hidden)=>`<div class="pad-wrap" data-padwrap="${k}" ${hidden?'hidden':''}><div class="pad-head"><span>${l}</span><button type="button" data-clear="${k}">Effacer</button></div><canvas class="pad" data-pad="${k}"></canvas></div>`;

const MORE=['adresse','cp','ville','niveau','profession','oeilD','oeilG','visite','incompat'];
const moreCount=()=>MORE.filter(k=>S[k]!=null&&S[k]!=='').length;
function renderForm(){
  const fsbBlock=g=>`<section class="block" id="sec-${g.n}"><h2><span class="n">${g.n}</span>${g.t}<span class="part" data-part="${g.n}"></span></h2>${g.n===5?'<p class="legend">F faible, S satisfait, B bon</p>':''}
    ${g.items.map(([k,l])=>`<div class="row"><span class="q">${l}</span>${single('fsb.'+k,['F','S','B'],'fsb')}</div>${help(k)}`).join('')}
    ${g.n===7?`<div class="row"><span class="q">Regard</span>${single('regard',['B','F1','F2','F3'],'fsb fsb4')}</div>${help('regard')}`:''}</section>`;
  $('#viewForm').innerHTML=`<div class="fl">
  <section class="block" id="sec-1"><h2><span class="n">1</span>Renseignements d’ordre général</h2>${RC.pickerHTML(S.eleveId)}<div class="grid">
    ${inp('nom','Nom','text','','autocomplete="off"')}${inp('prenom','Prénom','text','','autocomplete="off"')}
    ${inp('naissance','Date de naissance','date')}${inp('tel','Téléphone','tel')}
    <div><div class="lab">Lunettes ou lentilles</div>${single('correction',['Oui','Non'])}</div>
    <div class="full"><div class="lab">Boîte de vitesses de la formation</div>${single('boite',['manuelle','automatique'])}</div>
  </div>
  <details class="more" ${moreCount()?'':''}><summary>Informations complémentaires <small>${moreCount()?moreCount()+' renseignée'+(moreCount()>1?'s':''):'adresse, profession, vue… à compléter plus tard'}</small></summary><div class="grid">
    ${inp('adresse','Adresse','text','full')}${inp('cp','Code postal','text','','inputmode="numeric"')}${inp('ville','Ville')}
    ${inp('niveau','Niveau scolaire')}${inp('profession','Profession')}
    ${inp('oeilD','Acuité visuelle œil droit')}${inp('oeilG','Acuité visuelle œil gauche')}
    <div><div class="lab">Visite médicale</div>${single('visite',['Oui','Non'])}</div>
    ${inp('incompat','Incompatibilités','text','full')}
  </div></details></section>

  <section class="block" id="sec-2"><h2><span class="n">2</span>Expérience de la conduite<span class="part" data-part="2"></span></h2>
    <div class="group"><div class="lab">Permis déjà obtenu (le plus élevé)</div>${single('permis',PERMIS)}</div>
    <div class="group" data-permisdate>${inp('permisDate','Obtenu le','date')}</div>
    <div class="group"><div class="lab">Conduite auto</div>${single('conduite',CONDUITE)}</div>
    <div data-exp="conduit">
      <div class="group"><div class="lab">Avec qui ?</div><p class="legend">Si plusieurs réponses, retenir celle où l’élève a conduit le plus longtemps</p>${single('avecQui',AVEC)}</div>
      <div class="group" data-exp="ou"><div class="lab">Où (sauf auto-école)</div><p class="legend">En ville et sur route : cocher seulement Ville</p>${single('ou',OU)}</div>
    </div>
    <div class="group" data-exp="jamais"><div class="lab">Si pas auto</div><p class="legend">Moto seulement avec un permis moto, et jamais Moto et Cyclo ensemble</p>${multi('sinon',SINON)}</div>
  </section>

  <section class="block" id="sec-3"><h2><span class="n">3</span>Connaissance du véhicule<span class="part" data-part="3"></span></h2>
    <p class="legend">Trois questions par thème : Oui si l’élève répond juste aux trois, sinon Non</p>
    ${VEH.map(([k,l])=>`<div class="row"><span class="q">${l}</span>${single('veh.'+k,['Non','Oui'])}</div>`).join('')}
  </section>

  <section class="block" id="sec-4"><h2><span class="n">4</span>Attitude à l’égard de l’apprentissage et de la sécurité<span class="part" data-part="4"></span></h2>
    <p class="legend">Une seule réponse par groupe</p>${ATT.map(([k,opts])=>`<div class="checks att" data-single="${k}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${S[k]===v}"><span class="box"></span><span>${l}</span></button>`).join('')}</div>`).join('')}
  </section>

  ${Object.values(FSB).map(fsbBlock).join('')}

  </div><aside class="fr" aria-label="Résultat et signatures">
  <div class="sign" id="sec-res" aria-live="polite"><div class="sign-in">
    <h2><span class="n">9</span>Résultat de l’évaluation</h2>
    <div class="eq"><div class="c"><small>Positifs</small><b id="rPos">0</b></div><span class="op">−</span>
      <div class="c"><small>Négatifs</small><b id="rNeg">0</b></div><span class="op">=</span>
      <div class="c final"><small>Résultat final</small><b id="rRes">0</b></div></div>
    <div class="cat" id="rCat"></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="prat"><div class="lbl">Pratique proposée</div>
      <div class="hours"><button type="button" class="step" id="minus" aria-label="Retirer une heure">−</button>
      <div class="num" id="num">–</div><button type="button" class="step" id="plus" aria-label="Ajouter une heure">+</button></div>
      <div class="meta" id="meta"></div><button type="button" class="reset" id="reset" hidden>Revenir au calcul automatique</button></div>
  </div></div>

  <section class="block" id="sec-10"><h2><span class="n">10</span>Proposition : volume de formation prévisionnel</h2><div class="grid">
    ${inp('theorie','Théorie (heures)','number','','inputmode="numeric" min="0"')}
    <label class="f">Pratique (heures)<input type="text" id="pratMirror" readonly></label>
    <p class="fine full">Minimum de 25 h de pratique appliqué par Rousseau Conduite, quel que soit le résultat.</p>
    <div class="full"><div class="lab">Proposition acceptée</div>${single('acceptee',['Oui','Non'])}</div>
    <div class="full" data-retenue ${S.acceptee==='Non'?'':'hidden'}><div class="grid">
      ${inp('retTheo','Retenue : théorie (h)','number','','inputmode="numeric" min="0"')}${inp('retPrat','Retenue : pratique (h)','number','','inputmode="numeric" min="25"')}</div></div>
    ${inp('formateur','Formateur')}${inp('autorisation','N° d’autorisation')}
    ${inp('date','Date','date','full')}
  </div>
    ${pad('formateur','Signature formateur')}
    ${pad('eleve','Signature élève')}
    ${pad('parents','Signature parents (élève mineur)',!minor())}
    <details class="bareme"><summary>Voir le barème de calcul</summary><ul>
      <li>Permis : B1 +1, AM +2, A1 +2 (A2 et A comptés +2)</li>
      <li>Conduite auto : jamais 0, moins de 5 h +1, plus de 5 h +2</li>
      <li>Avec qui : amis −1, parents +1, auto-école +2 ; Où : ville −2, route −1, chemin 0</li>
      <li>Si pas auto : vélo 0, cyclo +1, quadricycle +1, moto +2, autre véhicule +1</li>
      <li>Connaissance du véhicule : Non 0, Oui +1</li>
      <li>Attitude : maîtriser la voiture −2 ou prévoir les difficultés +2 ; nécessité −2 ou réel désir +2</li>
      <li>Installation : F −2, S 0, B +2 ; démarrage arrêt : F −3, S 0, B +2 ; volant : F −2, S 0, B +2</li>
      <li>Compréhension et mémoire : F −1, S 0, B +1</li>
      <li>Trajectoire : F −4, S 0, B +3 ; observation et orientation : F −1, S 0, B +1 ; regard : B +2, F1 −1, F2 −2, F3 −3</li>
      <li>Émotivité (en général et crispation) : F −1, S 0, B +1</li>
      <li>Résultat faible sous −12, satisfaisant de −12 à +12, bon au-dessus de +12</li>
      <li>Pratique : 25 h si le résultat est de −12 ou plus, 27 h en dessous ; minimum bloqué à 25 h dans tous les cas</li>
      <li>Théorie conseillée : environ 10 h (satisfaisant) ou 13 h (faible), selon l’élève si le résultat est bon</li></ul></details>
  </section>

  <div class="actions">
    <button type="button" class="btn primary" id="save">Enregistrer l’évaluation</button>
    <button type="button" class="btn" id="export" ${downloads?'':'hidden'}>Télécharger la fiche</button>
    <button type="button" class="btn" id="print">Imprimer ou PDF</button>
    <button type="button" class="btn" id="copy">Partager le bilan</button>
    <button type="button" class="btn quiet" id="new">Nouvelle évaluation</button>
  </div></aside>`;
  document.querySelectorAll('canvas.pad').forEach(initPad);
  refreshExp();updateDerived();saveBadge();
}

function updateDerived(){
  const c=compute(),h=pratique(c);
  document.querySelectorAll('[data-part]').forEach(el=>{const p=c.parts[el.dataset.part];el.textContent=p&&p.a?`+${p.p} −${p.n}`:''});
  const js=document.getElementById('jumpScore');if(js)js.innerHTML=c.ans?`${c.res>0?'+':''}${c.res}<small>${h!=null?h+' h':''}</small>`:'Résultat<small>–</small>';
  $('#rPos').textContent=c.pos;$('#rNeg').textContent=c.neg;$('#rRes').textContent=c.res>0?'+'+c.res:c.res;
  $('#rCat').textContent=c.ans?`Résultat ${c.cat}`+(c.ans<c.tot?' (provisoire)':''):'';
  $('#meter').style.width=Math.round(c.ans/c.tot*100)+'%';
  $('#num').innerHTML=h==null?'–':`${h}<small>h</small>`;
  const left=c.tot-c.ans;
  $('#meta').innerHTML=c.ans===0?'Remplissez la fiche pour obtenir une proposition':
    (left?`Provisoire : ${left} critère${left>1?'s':''} à renseigner`:'Tous les critères sont renseignés')+
    (S.pratique!=null&&c.est!=null&&S.pratique!==c.est?`<br>Calcul automatique : ${c.est} h`:'')+
    (c.ans?(c.theo?`<br>Théorie conseillée : environ ${c.theo} h`:'<br>Théorie : selon les aptitudes de l’élève'):'');
  $('#minus').disabled=h==null||h<=c.min;$('#plus').disabled=h==null;$('#reset').hidden=S.pratique==null;
  $('#pratMirror').value=h==null?'':h+' h';
}

/* ---------- règles de la rubrique 2 ---------- */
function refreshExp(){
  const q=s=>document.querySelector(s);
  const drove=!!S.conduite&&S.conduite!=='Jamais';
  if(!drove){S.avecQui=null;S.ou=null}
  if(S.conduite!=='Jamais')S.sinon=[];
  if(S.avecQui==='Auto-école')S.ou=null;
  const motoOK=['A1','A2','A'].includes(S.permis);
  if(!motoOK)S.sinon=S.sinon.filter(x=>x!=='Moto');
  q('[data-permisdate]').hidden=!S.permis;
  q('[data-exp="conduit"]').hidden=!drove;
  q('[data-exp="ou"]').hidden=S.avecQui==='Auto-école';
  q('[data-exp="jamais"]').hidden=S.conduite!=='Jamais';
  ['avecQui','ou'].forEach(k=>q(`[data-single="${k}"]`).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',S[k]===x.dataset.v)));
  q('[data-multi="sinon"]').querySelectorAll('button').forEach(x=>{x.setAttribute('aria-pressed',S.sinon.includes(x.dataset.v));if(x.dataset.v==='Moto')x.disabled=!motoOK});
}

/* ---------- événements ---------- */
let draftT;
function touch(){S.updatedAt=Date.now();clearTimeout(draftT);draftT=setTimeout(()=>lsSet(LS_DRAFT,JSON.stringify(S)),300);saveBadge()}
function toggleMinor(){const w=document.querySelector('[data-padwrap="parents"]');const m=minor();if(w.hidden===!m)return;w.hidden=!m;if(m)w.querySelector('canvas')._redraw()}

$('#viewForm').addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;S[k]=e.target.value;
  if(k==='formateur'||k==='autorisation'){const p=pro();p[k]=e.target.value;lsSet(LS_PRO,JSON.stringify(p))}
  if(k==='naissance'||k==='date')toggleMinor();
  touch();
});
$('#viewForm').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('[data-single]');
  if(sg){const p=sg.dataset.single,cur=getP(S,p),v=b.dataset.v;
    const nv=(cur===v&&p!=='boite')?null:v;setP(S,p,nv);
    sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',getP(S,p)===x.dataset.v));
    if(p==='acceptee')document.querySelector('[data-retenue]').hidden=S.acceptee!=='Non';
    if(['permis','conduite','avecQui','ou'].includes(p))refreshExp();
    if(p==='boite'){const c=compute();if(S.pratique!=null&&S.pratique<c.min)S.pratique=c.min}
    touch();updateDerived();return}
  const mu=b.closest('[data-multi]');
  if(mu){const k=mu.dataset.multi,v=b.dataset.v,arr=S[k];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);
    b.setAttribute('aria-pressed',arr.includes(v));
    if(k==='sinon'){if(v==='Moto'&&arr.includes('Moto'))S.sinon=arr.filter(x=>x!=='Cyclo');if(v==='Cyclo'&&arr.includes('Cyclo'))S.sinon=arr.filter(x=>x!=='Moto');refreshExp()}
    touch();updateDerived();return}
  if(b.dataset.clear){S.sig[b.dataset.clear]=null;document.querySelector(`[data-pad="${b.dataset.clear}"]`)._redraw();touch();return}
  const c=compute();
  switch(b.id){
    case 'minus':S.pratique=Math.max(c.min,pratique(c)-1);touch();updateDerived();break;
    case 'plus':S.pratique=Math.min(99,pratique(c)+1);touch();updateDerived();break;
    case 'reset':S.pratique=null;touch();updateDerived();break;
    case 'save':saveCurrent();break;
    case 'export':exportFiche();break;
    case 'copy':shareBilan();break;
    case 'print':printFiche();break;
    case 'new':
      if((S.prenom||S.nom||c.ans)&&!isSaved()&&!confirm('Cette évaluation n’est pas enregistrée. Commencer une nouvelle fiche quand même ?'))break;
      S=blank();lsSet(LS_DRAFT,JSON.stringify(S));renderForm();window.scrollTo(0,0);toast('Nouvelle fiche prête');break;
  }
});

$('#viewForm').addEventListener('change',e=>{

/* ---------- signatures ---------- */
function initPad(cv){
  const key=cv.dataset.pad,ctx=cv.getContext('2d');let drawing=false,last=null;
  function size(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2.4;ctx.strokeStyle='#1C2B40'}
  cv._redraw=function(){size();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    if(S.sig[key]){const img=new Image();img.onload=()=>{const r=cv.getBoundingClientRect();ctx.drawImage(img,0,0,r.width,r.height)};img.src=S.sig[key]}};
  cv._redraw();
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,Math.PI*2);ctx.fillStyle='#1C2B40';ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;S.sig[key]=cv.toDataURL('image/png');touch()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>document.querySelectorAll('canvas.pad').forEach(c=>c._redraw&&c._redraw()),200)});

/* ---------- stockage ---------- */
let db=null,uid=null,downloads=null,history=[];
const localStore={
  list(){try{return JSON.parse(lsGet(LS_HIST))||[]}catch(e){return[]}},
  async save(ev){const l=this.list().filter(x=>x.id!==ev.id);l.push(ev);lsSet(LS_HIST,JSON.stringify(l));history=l;renderHist()},
  async remove(id){const l=this.list().filter(x=>x.id!==id);lsSet(LS_HIST,JSON.stringify(l));history=l;renderHist()}
};
const col=()=>db.collection('data/users/'+uid);
async function persist(ev){if(db&&uid)await col().doc(ev.id).set(JSON.parse(JSON.stringify(ev)));else await localStore.save(ev)}
async function unpersist(id){if(db&&uid)await col().doc(id).delete();else await localStore.remove(id)}
function isSaved(){const h=history.find(x=>x.id===S.id);return h&&h.updatedAt===S.updatedAt}
async function saveCurrent(){
  if(!S.prenom&&!S.nom){toast('Ajoutez au moins le nom de l’élève');document.querySelector('[data-in="nom"]').focus();return}
  const c=compute(),r=retenue(c);S.result={pos:c.pos,neg:c.neg,res:c.res,pratique:pratique(c),retTheo:r.t,retPrat:r.p};
  S.eleveId=RC.link(S);S.updatedAt=Date.now();lsSet(LS_DRAFT,JSON.stringify(S));
  try{await persist(S);toast('Évaluation enregistrée dans le dossier de '+RC.full(S));RC.check();renderForm()}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Stockage plein : supprimez d’anciennes évaluations':'Enregistrement impossible, réessayez')}
}

/* ---------- historique ---------- */
function renderHist(){
  const v=$('#viewHist'),l=[...history].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  $('#tabHist').textContent=l.length?`Historique (${l.length})`:'Historique';
  v.innerHTML=(!l.length?`<div class="hist-empty">Aucune évaluation enregistrée pour l’instant.<br>Remplissez une fiche puis touchez « Enregistrer l’évaluation ».</div>`:
   l.map(ev=>{const h=ev.result?.pratique??ev.result?.heures??ev.pratique;const dec=ev.acceptee?(ev.acceptee==='Oui'?', acceptée':', refusée'):'';
    return `<div class="card"><button class="open" data-open="${esc(ev.id)}"><div class="who">${esc([ev.prenom,ev.nom].filter(Boolean).join(' ')||'Sans nom')}</div>
    <div class="sub">${esc(frDate(ev.date))}${ev.result&&ev.result.res!=null?', résultat '+(ev.result.res>0?'+':'')+ev.result.res:''}${dec}</div></button>
    <div class="h">${h!=null?h+' h':'–'}</div><button class="del" data-del="${esc(ev.id)}" aria-label="Supprimer">✕</button></div>`}).join(''))+
   `<p class="src">Fiches gardées uniquement sur cet appareil. <span data-bk-last>${RC.lastText()}</span><small>La sauvegarde regroupe les évaluations et les examens blancs. Copiez-la ensuite sur Google Drive ou envoyez-la-vous par mail.</small></p>
   <div class="actions" style="margin-top:10px"><button type="button" class="btn" data-bk-now>Tout sauvegarder</button>
   <button type="button" class="btn" data-restore>Restaurer une sauvegarde</button></div>
   <input type="file" accept=".json,application/json" id="restoreFile" hidden>`;

$('#viewHist').addEventListener('click',async e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){const ev=history.find(x=>x.id===o.dataset.open);if(!ev)return;S=normalize(JSON.parse(JSON.stringify(ev)));S.v=2;

function show(w){const f=w==='form';$('#viewForm').hidden=!f;$('#viewHist').hidden=f;

$('#tabForm').onclick=()=>show('form');$('#tabHist').onclick=()=>show('hist');

/* ---------- résumé et export ---------- */
const nomComplet=()=>[S.prenom,S.nom].filter(Boolean).join(' ')||'Élève';
function summary(){const c=compute(),h=pratique(c),r=retenue(c);
  return `Rousseau Conduite, évaluation de départ du ${frDate(S.date)}
Élève : ${nomComplet()}
Résultat : ${c.pos} positifs, ${c.neg} négatifs, résultat final ${c.res>0?'+':''}${c.res} (${c.cat})
Proposition : ${S.theorie?S.theorie+' h de théorie, ':''}${h!=null?h+' h de pratique':'pratique non définie'}
Proposition acceptée : ${S.acceptee||'non renseigné'}${S.acceptee==='Non'&&(r.t||r.p)?`\nProposition retenue : ${r.t||0} h de théorie, ${r.p||0} h de pratique`:''}${S.formateur?'\nFormateur : '+S.formateur:''}`}
function shareBilan(){const T=RC.T;
  RC.openShare({title:'Bilan de l’évaluation de départ',tel:S.tel,templates:[{id:'bilan',label:'Bilan',build:tu=>{
    const c=compute(),h=pratique(c),r=retenue(c),p=S.prenom;

      `Ce volume est une estimation : il pourra évoluer selon ${T(tu,'ta','votre')} progression.`,
      '','À très vite sur la route !','Rousseau Conduite'].filter(x=>x!==null).join('\n')}}]})}
async function copySummary(){const t=summary();
  try{await navigator.clipboard.writeText(t);toast('Résumé copié')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Résumé copié':'Copie bloquée par le navigateur')}}

window.__fiche=()=>ficheHTML(false);
async function exportFiche(){if(!downloads)return;
  const slug=nomComplet().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'eleve';
  try{await downloads.save({filename:`evaluation-${slug}-${S.date||todayISO()}.html`,data:ficheHTML()});toast('Fiche téléchargée')}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Patientez un instant puis réessayez');return}
    if(e&&(e.code==='unavailable'||e.code==='not_granted')){$('#export').hidden=true}toast('Téléchargement impossible ici')}}

let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- fichiers (version autonome) ---------- */

  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
