<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22416D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tableau | Rousseau Conduite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5;--surface:#FFFFFF;--ink:#1C2B40;--muted:#5A6B7C;--line:#D2DDE3;--chip:#E2EBEF;
  --navy:#22416D;--navy-ink:#FFFFFF;--teal:#2A9DAE;--green:#8CC89F;--tealtext:#23798A;
  --F:#C9573C;--S:#2A8FA0;--B:#3E9A62;
  --display:"Montserrat","Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}}
:root[data-theme="dark"]{
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--green))}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:1rem;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b{color:#fff}}
:root[data-theme="dark"] .brand b{color:#fff}
.brand span{font-size:.82rem;color:var(--tealtext);font-weight:700}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.block h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:10px;line-height:1.2;color:var(--ink)}
.block h2 .n{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-size:.85rem;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f,.lab{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:700}
.lab{margin:0 0 6px}
input[type=text],input[type=date],input[type=tel],input[type=number],textarea{
  width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:1rem;color:var(--ink)}
.group{margin-top:14px}
.group:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:.9rem;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.seg.multi button[aria-pressed="true"]::before{content:"✓ "}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row .q{font-weight:700}
.row .seg{flex:none;flex-wrap:nowrap}

.checks button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;font-size:.95rem}
.checks button:first-child{border-top:0;padding-top:0}
.checks.att{padding:10px 0}.checks.att+.checks.att{border-top:2px solid var(--line)}.checks.att .box{border-radius:50%}
.checks .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.95rem}
.checks button[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}
.checks button[aria-pressed="true"] .box::before{content:"✓"}

.legend{font-size:.8rem;color:var(--muted);margin:-6px 0 10px}
.group .legend{margin:-2px 0 8px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
details.help{font-size:.84rem;color:var(--muted);margin:-4px 0 8px}
details.help summary{cursor:pointer;color:var(--tealtext);font-weight:700;width:max-content}
details.help ul{margin:6px 0 0;padding-left:0;list-style:none}
details.help li{margin:3px 0}
details.help li b{display:inline-block;min-width:1.8rem;color:var(--ink)}
.block h2 .part{margin-left:auto;font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--tealtext);white-space:nowrap}
.cat{font-weight:700;margin-top:8px;color:var(--green)}
.fsb{display:grid;grid-template-columns:repeat(3,48px);gap:6px;flex:none}
.fsb button{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-family:var(--display);font-weight:700;cursor:pointer}
.fsb button[aria-pressed="true"]{color:#fff;border-color:transparent}
.fsb button[data-v="F"][aria-pressed="true"],.fsb button[data-v="F2"][aria-pressed="true"]{background:var(--F)}
.fsb button[data-v="F1"][aria-pressed="true"]{background:#C98A1E}
.fsb button[data-v="F3"][aria-pressed="true"]{background:#9E3324}
.fsb4{grid-template-columns:repeat(4,48px)}
.fsb button[data-v="S"][aria-pressed="true"]{background:var(--S)}
.fsb button[data-v="B"][aria-pressed="true"]{background:var(--B)}

/* Panneau résultat */
.sign{background:var(--navy);color:#fff;border-radius:16px;padding:6px;margin:0 0 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sign{background:#22416D}}
:root[data-theme="dark"] .sign{background:#22416D}
.sign-in{border:3px solid #fff;border-radius:11px;padding:14px 14px 12px;text-align:center}
.sign h2{font-family:var(--display);font-weight:700;font-size:1rem;margin:0 0 10px;display:flex;justify-content:center;align-items:center;gap:8px}
.sign h2 .n{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;color:#22416D;font-size:.8rem}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.eq .c{display:flex;flex-direction:column;align-items:center;min-width:64px}
.eq .c small{font-size:.75rem;opacity:.85}
.eq .c b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.eq .op{font-family:var(--display);font-size:1.6rem;font-weight:700;opacity:.7;padding-bottom:4px}
.eq .c.final b{color:var(--green);font-size:2.4rem}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.prat .lbl{font-weight:700;font-size:.9rem;opacity:.92}
.hours{display:flex;align-items:center;justify-content:center;gap:18px;margin:2px 0}
.num{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:1.6rem;margin-left:3px}
.step{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;font-weight:700}
.step:disabled{opacity:.35;cursor:default}
.meta{font-size:.88rem;opacity:.95}
.reset{background:none;border:0;color:#fff;text-decoration:underline;font-size:.86rem;cursor:pointer;margin-top:4px}
.fine{font-size:.8rem;color:var(--muted);margin:6px 0 0;font-style:italic}

.pad-wrap{margin-top:12px}
.pad-head{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.pad-head button{background:none;border:0;color:var(--tealtext);font-weight:700;cursor:pointer;padding:4px}
canvas.pad{display:block;width:100%;height:130px;background:#fff;border:1px dashed #9AA9B6;border-radius:10px;touch-action:none}

details.bareme{margin-top:12px;font-size:.88rem;color:var(--muted)}
details.bareme summary{cursor:pointer;font-weight:700;color:var(--tealtext)}
details.bareme ul{margin:8px 0 0;padding-left:18px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 10px;font-weight:700;cursor:pointer;min-height:50px}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);grid-column:1/-1;font-size:1.05rem}
.btn.quiet{background:transparent}

.hist-empty{text-align:center;color:var(--muted);padding:40px 12px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.card .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:.85rem;color:var(--muted)}
.card .h{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--tealtext);min-width:3.2rem;text-align:right}
.card .del{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px 8px}
.src{font-size:.8rem;color:var(--muted);text-align:center;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (max-width:400px){.grid{grid-template-columns:1fr}.fsb{grid-template-columns:repeat(3,42px)}.row{align-items:flex-start;flex-direction:column}.row .fsb{align-self:stretch;grid-template-columns:repeat(3,1fr)}.row .fsb4{grid-template-columns:repeat(4,1fr)}}

.apps{max-width:760px;margin:0 auto;padding:6px 16px 8px;display:flex;gap:6px}
.apps a{flex:1;text-align:center;padding:7px 8px;border-radius:999px;font-weight:700;font-size:.86rem;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.apps a[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}

.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.lab .sub,.checks .sub{font-weight:400;color:var(--tealtext)}
.checks small{color:var(--muted);font-size:.82rem}
.top2{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.top2{grid-template-columns:1.1fr 1fr;gap:12px}.top2 .block{margin-bottom:12px}}
h2.pill{display:inline-flex;background:var(--chip);border-radius:999px;padding:5px 14px;font-size:.95rem;margin:0 0 12px}
.epreuve .dur{font-weight:700;margin:0 0 4px}.epreuve ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--ink)}.epreuve li{margin:3px 0}
.epreuve .min{color:var(--B);font-size:.82rem;font-weight:700;margin:8px 0 0}
.notation ul{list-style:none;margin:0;padding:0;font-size:.86rem}.notation li{display:flex;gap:10px;align-items:center;margin:6px 0}
.dot{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:.85rem}
h3.bilan{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:18px 2px 10px}
.block.comp{padding:0;overflow:hidden}
h2.band{margin:0;padding:12px 16px;background:var(--chip);font-size:1rem;display:flex;align-items:center;gap:10px}
.comp .item,.comp .checks{padding:12px 16px}.comp .item+.item{border-top:1px solid var(--line)}
.ihead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.ihead .q{font-weight:700;flex:1}
.inum{flex:none;font-family:var(--display);font-weight:800;font-size:.78rem;color:var(--tealtext);min-width:1.6rem}
.imax{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap}
.vchk{padding:0!important;margin-top:8px}.comp label.f{margin-bottom:4px}
:root{--cE:#E5484D;--c0:#F2A33A;--c1:#F8CB94;--c2:#FCE3A0;--c3:#5DAE5A}
.lvl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;max-width:420px}
.lvl button{height:48px;border-radius:10px;border:0;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;color:#1C2B40;opacity:.38;transition:opacity .15s,transform .15s}
.lvl button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.lvl button{transition:none}}
[data-c="E"]{background:var(--cE);color:#fff!important}[data-c="0"]{background:var(--c0);color:#1C2B40}[data-c="1"]{background:var(--c1);color:#1C2B40}
[data-c="2"]{background:var(--c2);color:#1C2B40}[data-c="3"]{background:var(--c3);color:#fff!important}
.seg button.e[aria-pressed="true"]{background:var(--cE);border-color:var(--cE);color:#fff}
.seg.res button[data-v="ok"][aria-pressed="true"]{background:var(--c3);border-color:var(--c3)}
.sign h2{justify-content:center}
.score{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 8px}
.score b{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-family:var(--display);font-weight:700;font-size:1.6rem;opacity:.8}
.track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.2)}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .3s}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.trackl{position:relative;height:18px;font-size:.75rem;opacity:.85;margin-top:4px}
.trackl span{position:absolute;transform:translateX(-50%)}.trackl span:first-child{left:0;transform:none}.trackl span:last-child{right:0;left:auto;transform:none}
.subs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin:8px 0 2px}
.subs span{display:flex;align-items:baseline;gap:3px}.subs small{opacity:.8;font-size:.75rem}.subs b{font-family:var(--display);font-size:1.05rem}
.status{font-family:var(--display);font-weight:800;font-size:1.3rem;margin-top:8px}
.status.favorable{color:var(--green)}.status.insuffisant,.status.elim{color:#FF8A8F}.status.nonterm{color:#fff}
.card .h small{font-size:.8rem;opacity:.7;margin-left:2px}
.st.favorable{color:var(--B);font-weight:700}.st.insuffisant,.st.elim,.st.eliminatoire{color:var(--cE);font-weight:700}.st.nonterm{font-weight:700}

.bk{background:#FFF4D6;border:1px solid #E9B949;color:#4A3800;border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.checks .elimchips button{display:inline-flex;width:auto;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--bg);font-size:.9rem;min-height:40px}
.checks .elimchips button[aria-pressed="true"]{background:var(--cE);border-color:var(--cE);color:#fff;font-weight:700}
.bk-txt{display:flex;flex-direction:column;gap:2px;font-size:.9rem;flex:1 1 220px}
.bk-act{display:flex;gap:8px;flex-wrap:wrap}.bk .btn{min-height:42px;padding:9px 12px;font-size:.9rem}
.bk .btn[data-bk-now]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}.bk .btn.quiet{color:#4A3800;border-color:#E9B949}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root:not([data-theme="light"]) .bk .btn.quiet{color:#F7E3A6}}
:root[data-theme="dark"] .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root[data-theme="dark"] .bk .btn.quiet{color:#F7E3A6}
.src small{display:block;margin-top:4px}

.pick{margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.pick.on{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--chip);border:0;border-radius:12px;padding:10px 12px}
.pick-res{display:flex;flex-direction:column;gap:6px;margin-top:8px}.pick-res:empty{display:none}
.pick-res button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.pick-res small{color:var(--muted)}
.pick-hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.linkbtn{background:none;border:0;color:var(--tealtext);font-weight:700;cursor:pointer;padding:6px 0;font-size:.9rem}
input[type=search]{width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink)}

.apps a.homeb{flex:0 0 auto;display:grid;place-items:center;padding:6px 12px}
.homelink{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}

.shm{position:fixed;inset:0;z-index:30;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.shm{align-items:center}}
.shm-in{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.shm-in{border-radius:18px}}
.shm-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.shm-h b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.shm-x{background:var(--chip);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;color:var(--ink)}
.shm-fields:empty{display:none}
.shm-tu button,.shm-tpl button{flex:1}
.shm-text{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:.95rem;line-height:1.45;color:var(--ink);resize:vertical;min-height:200px}
.shm-note{margin:-4px 0 0;font-size:.78rem;color:var(--muted)}
.shm-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shm-act .btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.shm-act .btn.primary{grid-column:1/-1;background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

.shm input{width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);min-height:44px}
.shm-fields label:last-child:nth-child(odd){grid-column:1/-1}
.apps a{white-space:nowrap}
@media (max-width:440px){.apps{gap:5px}.apps a{font-size:.8rem;padding:7px 4px}.apps a.homeb{padding:6px 10px}}

.vq{padding:10px 0;border-top:1px solid var(--line)}.vq:first-child{border-top:0;padding-top:4px}
.vq-cat{font-size:.75rem;font-weight:700;color:var(--tealtext);text-transform:none}
.vq-q{margin:2px 0 6px;font-weight:700}
.vq-a{margin:0 0 6px;font-size:.9rem}.vq-a summary{cursor:pointer;color:var(--tealtext);font-weight:700;width:max-content}.vq-a p{margin:6px 0 0;background:var(--chip);border-radius:10px;padding:8px 10px}
.checks .vq-ok{padding:6px 0!important;border-top:0!important}
.vq-serie{margin:8px 0 0;font-weight:700;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vq-serie{color:var(--tealtext)}}

/* barre de suivi */
.jump{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:8px}
.jsc{flex:none;display:flex;align-items:baseline;gap:5px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:.95rem;border:0;cursor:pointer}
.jsc small{font-weight:700;opacity:.85;font-size:.72rem;font-family:var(--body)}
.jlinks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.jlinks::-webkit-scrollbar{display:none}
.jlinks a{flex:none;font-size:.8rem;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface)}
.jlinks a.on{color:var(--navy-ink);background:var(--tealtext);border-color:var(--tealtext)}
.save-b{flex:none;border-radius:999px;padding:6px 11px;font-weight:700;font-size:.78rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.save-b.no{background:#FFF4D6;color:#5C4300;border:1px solid #E9B949}
.save-b.ok{background:#E3F3E8;color:#23603A;border:1px solid #9FD2B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .save-b.no{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root:not([data-theme="light"]) .save-b.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}}
:root[data-theme="dark"] .save-b.no{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root[data-theme="dark"] .save-b.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}
html{scroll-padding-top:calc(var(--hh,150px) + 8px)!important}
@media (max-width:440px){.jump{gap:6px}.save-b{padding:6px 9px}}
/* informations complémentaires */
details.more{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--tealtext);list-style-position:inside}
details.more summary small{color:var(--muted);font-weight:400;margin-left:4px}
details.more[open]{padding-bottom:12px}
/* tablette en largeur : deux colonnes */
@media (min-width:1000px){
  main.wide,.bar-in,.apps,.jump{max-width:1240px}
  #viewForm{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  .fr{position:sticky;top:calc(var(--hh,150px) + 8px);max-height:calc(100vh - var(--hh,150px) - 16px);overflow:auto;padding:0 4px 8px;overscroll-behavior:contain}
  .fr .actions{grid-template-columns:1fr 1fr}
}
/* fenêtre « quitter la fiche » */
.lv-in .btn{width:100%}

.shm-att{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chip);border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.shm-att .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:700;background:var(--surface)}
.shm-att[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}.shm-att[aria-pressed="true"] .box::before{content:"✓"}
.shm-att span:last-child{display:flex;flex-direction:column}.shm-att small{color:var(--muted);font-size:.8rem}
.shm-act .btn:disabled{opacity:.7;cursor:wait}

/* tableau */
main.tbm{max-width:none;padding:8px 10px 10px}
.tbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.tbar::-webkit-scrollbar,.tray::-webkit-scrollbar{display:none}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;padding:0 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.tb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb span{display:none}.tb.bgb span,#saveBtn span,.tray .tb span{display:inline}
@media (min-width:1500px){.tb span{display:inline}}
.tb[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tb:disabled{opacity:.4;cursor:default}
#saveBtn.ok{background:#E3F3E8;color:#23603A;border-color:#9FD2B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #saveBtn.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}}
:root[data-theme="dark"] #saveBtn.ok{background:#15321F;color:#9FE0B4;border-color:#2F6B45}
.tb.danger{color:#C0333A}
.sw{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;margin:0 2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sep{flex:none;width:1px;height:28px;background:var(--line);margin:0 3px}
.stagewrap{display:flex;justify-content:center}
.stage{position:relative;touch-action:none;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{pointer-events:none}
.stage[data-tool="move"] [data-pid]{cursor:grab}
.stage[data-tool="pen"],.stage[data-tool="arrow"]{cursor:crosshair}
.tray{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;min-height:70px}
.pc{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:5px 6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.pc svg{width:38px;height:38px}
.selg{flex:none;display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:14px;padding:4px 6px}
.trl{flex:none;font-weight:700;color:var(--tealtext);margin-right:4px;font-size:.9rem}
body.focus header.bar{display:none}
.homeb2{display:none;text-decoration:none}body.focus .homeb2{display:inline-flex}
@media (max-height:520px){header.bar{display:none}.homeb2{display:inline-flex}.pc span{display:none}.pc{min-width:52px}.pc svg{width:34px;height:34px}.tray{min-height:0;padding-top:6px}.tbar{padding-bottom:6px}}
body.focus .bk{display:none!important}
.shm-in.wide{max-width:900px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bgt{display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--ink);text-align:left}
.bgt svg{width:100%;height:auto;border-radius:6px;display:block}
.bgt.on{border-color:var(--teal)}
.shm select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);min-height:44px}
.scl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sci{position:relative}
.sco{display:flex;flex-direction:column;gap:6px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;cursor:pointer;text-align:left;color:var(--ink)}
.sco img{width:100%;border-radius:6px;display:block;aspect-ratio:3/2;object-fit:cover;background:#fff}
.sco span{display:flex;flex-direction:column;gap:1px;padding:0 4px 4px}.sco small{color:var(--muted)}
.scd{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1C2B40;cursor:pointer;font-size:.9rem;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* barre du haut : retour à l'accueil + Élèves */
.homelink .backc{flex:none;display:grid;place-items:center;width:20px;margin-right:-6px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .homelink .backc{color:var(--tealtext)}}
:root[data-theme="dark"] .homelink .backc{color:var(--tealtext)}
.topbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 11px;min-height:42px;font-weight:700;font-size:.9rem;text-decoration:none}
.topbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<script>
/* Rousseau Conduite : données communes (élèves, sauvegarde) */
window.RC=(function(){
  const K={ev:'rc-eval:history',ex:'rc-exam:history',bi:'rc-bilan:history',ve:'rc:vehicule',de:'rc:dessins',el:'rc:eleves',last:'rc:lastBackup',snooze:'rc:backupSnooze'};
  const DAY=864e5,LIMIT=7;
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const list=k=>{try{return JSON.parse(get(k))||[]}catch(e){return[]}};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
  const fr=ts=>{const[y,m,d]=iso(ts).split('-');return `${d}/${m}/${y}`};
  let toast=()=>{};

  /* ---------- élèves ---------- */
  const FIELDS=['nom','prenom','naissance','tel','adresse','cp','ville','niveau','profession','nationalite','boite'];
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const keyOf=o=>norm(o.nom)+'|'+norm(o.prenom);
  const full=e=>[e.prenom,e.nom].filter(Boolean).join(' ')||'Sans nom';
  const eleves=()=>list(K.el);
  const saveEleves=l=>set(K.el,JSON.stringify(l));
  const eleve=id=>id?eleves().find(e=>e.id===id)||null:null;
  const newId=()=>'el'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  function link(rec){
    if(!rec.nom&&!rec.prenom)return rec.eleveId||null;
    const l=eleves();let e=rec.eleveId&&l.find(x=>x.id===rec.eleveId);
    if(!e)e=l.find(x=>keyOf(x)===keyOf(rec));
    if(!e){e={id:newId(),createdAt:Date.now(),notes:''};l.push(e)}
    FIELDS.forEach(f=>{if(rec[f]!=null&&rec[f]!=='')e[f]=rec[f]});
    e.updatedAt=Date.now();saveEleves(l);return e.id}
  function addEleve(o){const l=eleves(),e=Object.assign({id:newId(),createdAt:Date.now(),updatedAt:Date.now(),notes:''},o);l.push(e);saveEleves(l);return e}
  function updateEleve(id,patch){const l=eleves(),e=l.find(x=>x.id===id);if(!e)return;Object.assign(e,patch,{updatedAt:Date.now()});saveEleves(l);
    /* garder les noms des fiches à jour */
    [K.ev,K.ex,K.bi].forEach(k=>{const r=list(k);let ch=false;r.forEach(x=>{if(x.eleveId===id){['nom','prenom'].forEach(f=>{if(patch[f]!=null&&x[f]!==patch[f]){x[f]=patch[f];ch=true}})}});if(ch)set(k,JSON.stringify(r))})}
  function deleteEleve(id){saveEleves(eleves().filter(e=>e.id!==id));
    [K.ev,K.ex,K.bi,K.de].forEach(k=>set(k,JSON.stringify(list(k).filter(x=>x.eleveId!==id))))}
  function syncAll(){[K.ev,K.ex,K.bi].forEach(k=>{const recs=list(k);let ch=false;
    [...recs].sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0)).forEach(r=>{if(!r.eleveId&&(r.nom||r.prenom)){r.eleveId=link(r);ch=true}});
    if(ch)set(k,JSON.stringify(recs))})}
  const recordsOf=id=>({ev:list(K.ev).filter(x=>x.eleveId===id),ex:list(K.ex).filter(x=>x.eleveId===id),bi:list(K.bi).filter(x=>x.eleveId===id),de:list(K.de).filter(x=>x.eleveId===id)});

  /* sélecteur d'élève dans les fiches */
  let onPick=null,onClear=null;
  function pickerHTML(id){const e=eleve(id);
    if(e)return `<div class="pick on"><span>Dossier de <b>${esc(full(e))}</b></span><button type="button" class="linkbtn" data-eleve-clear>Changer d’élève</button></div>`;
    if(!eleves().length)return `<p class="pick-hint">Nouvel élève : son dossier sera créé à l’enregistrement.</p>`;
    return `<div class="pick"><label class="f">Élève déjà suivi ?<input type="search" data-eleve-search placeholder="Rechercher par nom ou prénom" autocomplete="off"></label>
      <div class="pick-res" data-eleve-results></div><p class="pick-hint">Nouvel élève ? Remplissez la fiche, son dossier sera créé à l’enregistrement.</p></div>`}
  function results(q){const n=norm(q);let l=eleves();
    l=n?l.filter(e=>norm(full(e)+' '+full({prenom:e.nom,nom:e.prenom})).includes(n)):l.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    return l.slice(0,6).map(e=>`<button type="button" data-eleve-pick="${esc(e.id)}"><b>${esc(full(e))}</b>${e.tel?`<small>${esc(e.tel)}</small>`:''}</button>`).join('')||'<p class="pick-hint">Aucun élève trouvé.</p>'}
  const showRes=inp=>{const box=inp.closest('.pick').querySelector('[data-eleve-results]');box.innerHTML=results(inp.value)};
  document.addEventListener('input',e=>{if(e.target.matches('[data-eleve-search]'))showRes(e.target)});
  document.addEventListener('focusin',e=>{if(e.target.matches('[data-eleve-search]'))showRes(e.target)});

  /* ---------- sauvegarde ---------- */
  function saveFile(name,data){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  function status(){const n=list(K.ev).length+list(K.ex).length+list(K.bi).length,last=+get(K.last)||0;
    return{n,last,days:last?Math.floor((Date.now()-last)/DAY):null}}
  function lastText(){const s=status();return s.last?`Dernière sauvegarde le ${fr(s.last)}.`:'Aucune sauvegarde faite pour l’instant.'}
  function backup(){const ev=list(K.ev),ex=list(K.ex),bi=list(K.bi),de=list(K.de),el=eleves();
    const ve=veh();if(!ev.length&&!ex.length&&!bi.length&&!el.length&&!ve&&!de.length){toast('Aucune fiche à sauvegarder');return}
    saveFile(`sauvegarde-rousseau-conduite-${iso(Date.now())}.json`,JSON.stringify({app:'rousseau-conduite',v:5,date:Date.now(),eleves:el,evaluations:ev,examens:ex,bilans:bi,vehicule:ve,dessins:de}));
    set(K.last,String(Date.now()));check();
    toast(`Sauvegarde téléchargée : ${el.length} élève${el.length>1?'s':''}, ${ev.length+ex.length+bi.length} fiche${ev.length+ex.length+bi.length>1?'s':''}`)}
  function mergeInto(k,items,ok){const byId=Object.fromEntries(list(k).map(x=>[x.id,x]));let n=0;
    (items||[]).filter(x=>x&&x.id&&ok(x)).forEach(x=>{n++;if(!byId[x.id]||(x.updatedAt||0)>(byId[x.id].updatedAt||0))byId[x.id]=x});
    if(n)set(k,JSON.stringify(Object.values(byId)));return n}
  async function restore(file){
    try{const d=JSON.parse(await file.text());
      const el=mergeInto(K.el,d.eleves,()=>true),ev=mergeInto(K.ev,d.evaluations,x=>x.v===2),ex=mergeInto(K.ex,d.examens,x=>x.v===1),bi=mergeInto(K.bi,d.bilans,x=>x.v===1),de=mergeInto(K.de,d.dessins,x=>x.v===1);
      let vo=0;if(d.vehicule&&d.vehicule.contrat){const cur=veh();if(!cur||(d.vehicule.updatedAt||0)>(cur.updatedAt||0)){set(K.ve,JSON.stringify(d.vehicule));vo=1}}
      if(!el&&!ev&&!ex&&!bi&&!de&&!vo&&!(d.vehicule&&d.vehicule.contrat))throw 0;syncAll();
      toast(`Restauré : ${ev} évaluation${ev>1?'s':''}, ${ex} examen${ex>1?'s':''} blanc${ex>1?'s':''}, ${bi} bilan${bi>1?'s':''}`);check();return true}
    catch(e){toast('Fichier de sauvegarde non reconnu');return false}}
  function check(){const el=document.getElementById('bkBanner');if(!el)return;const s=status();
    const due=s.n>0&&(!s.last||s.days>=LIMIT)&&Date.now()>(+get(K.snooze)||0);
    el.hidden=!due;
    if(due)el.querySelector('[data-bk-txt]').textContent=s.last?`Votre dernière sauvegarde date de ${s.days} jours.`:`Vous avez ${s.n} fiche${s.n>1?'s':''} enregistrée${s.n>1?'s':''} et aucune sauvegarde.`;
    document.querySelectorAll('[data-bk-last]').forEach(x=>x.textContent=lastText())}
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-bk-now]'))backup();
    if(e.target.closest('[data-bk-later]')){set(K.snooze,String(Date.now()+DAY));check()}
    const p=e.target.closest('[data-eleve-pick]');if(p&&onPick){const x=eleve(p.dataset.elevePick);if(x)onPick(x)}
    if(e.target.closest('[data-eleve-clear]')&&onClear)onClear();
  });

  /* ---------- partage de messages et de documents ---------- */
  const T=(tu,a,b)=>tu?a:b;
  function copyText(t){return navigator.clipboard?navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t)):Promise.resolve(fallbackCopy(t))}
  function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
  async function shareText(title,text){
    if(navigator.share){try{await navigator.share({title,text});return}catch(e){if(e&&e.name==='AbortError')return}}
    toast(await copyText(text)?'Message copié : collez-le dans votre messagerie':'Partage impossible ici')}
  async function shareFile(url,name,title){
    try{if(navigator.canShare){const blob=await (await fetch(url)).blob();const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return}}}
    catch(e){if(e&&e.name==='AbortError')return}
    window.open(url,'_blank')}
  let shm=null;
  function openShare(o){
    closeShare();let tpl=o.templates[0],tu=(get('rc:tu')||'tu')==='tu',edited=false;
    const el=document.createElement('div');el.className='shm';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',o.title);
    const fieldsHTML=t=>(t.fields||[]).map(f=>`<label class="f">${esc(f.label)}<input type="${f.type||'text'}" data-shm-f="${f.k}" value="${esc(f.value||'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></label>`).join('');
    el.innerHTML=`<div class="shm-in"><div class="shm-h"><b>${esc(o.title)}</b><button type="button" class="shm-x" data-shm-close aria-label="Fermer">✕</button></div>
      ${o.templates.length>1?`<div class="seg shm-tpl">${o.templates.map(t=>`<button type="button" data-shm-tpl="${t.id}" aria-pressed="${t===tpl}">${esc(t.label)}</button>`).join('')}</div>`:''}
      <div class="shm-fields grid"></div>
      <div class="seg shm-tu"><button type="button" data-shm-tu="tu">Tutoiement</button><button type="button" data-shm-tu="vous">Vouvoiement</button></div>
      <textarea class="shm-text" rows="11"></textarea><p class="shm-note">Vous pouvez modifier le texte avant de l’envoyer.</p>
      ${o.attach?`<button type="button" class="shm-att" data-shm-att aria-pressed="true"><span class="box"></span><span><b>${esc(o.attach.title||'Joindre la fiche en PDF')}</b><small>${esc(o.attach.label)}</small></span></button>`:''}
      <div class="shm-act"><button type="button" class="btn primary" data-shm-share>Partager</button>${o.tel?`<a class="btn" data-shm-sms href="#">Envoyer par SMS</a>`:''}<button type="button" class="btn" data-shm-copy>Copier</button></div></div>`;
    document.body.appendChild(el);shm=el;document.documentElement.style.overflow='hidden';
    const ta=el.querySelector('.shm-text');
    const vals=()=>Object.fromEntries([...el.querySelectorAll('[data-shm-f]')].map(i=>[i.dataset.shmF,i.value]));
    const sms=()=>{const a=el.querySelector('[data-shm-sms]');if(a)a.href=`sms:${o.tel.replace(/\s/g,'')}?body=${encodeURIComponent(ta.value)}`};
    const regen=()=>{ta.value=tpl.build(tu,vals());edited=false;sms()};
    const paint=()=>{el.querySelector('.shm-fields').innerHTML=fieldsHTML(tpl);el.querySelectorAll('[data-shm-tu]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.shmTu==='tu')===tu));regen()};
    paint();
    el.addEventListener('input',e=>{if(e.target===ta){edited=true;sms()}else if(e.target.dataset.shmF!=null)regen()});
    el.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(e.target===el){closeShare();return}if(!b)return;
      if(b.dataset.shmClose!=null)closeShare();
      else if(b.dataset.shmTu){if(edited&&!confirm('Refaire le message ? Vos modifications seront perdues.'))return;tu=b.dataset.shmTu==='tu';set('rc:tu',tu?'tu':'vous');paint()}
      else if(b.dataset.shmTpl){if(edited&&!confirm('Changer de message ? Vos modifications seront perdues.'))return;tpl=o.templates.find(t=>t.id===b.dataset.shmTpl);el.querySelectorAll('[data-shm-tpl]').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()}
      else if(b.dataset.shmAtt!=null)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
      else if(b.dataset.shmShare!=null){const att=el.querySelector('[data-shm-att]');
        if(o.attach&&att&&att.getAttribute('aria-pressed')==='true'){b.disabled=true;const lab=b.textContent;b.textContent='Préparation du PDF…';
          try{const file=await o.attach.make();
            if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:o.title,text:ta.value})}catch(e){if(!(e&&e.name==='AbortError'))toast('Partage impossible ici')}}
            else{downloadFile(file);await copyText(ta.value);toast((o.attach.kind||'PDF')+' téléchargé et message copié : joignez-le à votre message')}}
          catch(e){toast('Impossible de créer le fichier');shareText(o.title,ta.value)}
          finally{b.disabled=false;b.textContent=lab}}
        else shareText(o.title,ta.value)}
      else if(b.dataset.shmCopy!=null)toast(await copyText(ta.value)?'Message copié':'Copie impossible ici');
    });
    el.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare()});
    setTimeout(()=>el.querySelector('.shm-x').focus(),50);
  }
  function closeShare(){if(shm){shm.remove();shm=null;document.documentElement.style.overflow=''}}
  const DOCS=[{url:'memo-verifications-premiers-secours.pdf',title:'Mémo vérifications et premiers secours',sub:'2 pages, l’essentiel à retenir'},
    {url:'les-100-questions.pdf',title:'Les 100 questions de vérification',sub:'11 pages, toutes les séries avec leurs réponses'},
    {url:'vos-donnees-personnelles.pdf',title:'Vos données personnelles',sub:'1 page, à remettre à l’élève lors de l’évaluation de départ'}];

  /* ---------- fiche en PDF (sans bibliothèque externe) ---------- */
  const A4W=794,PAD=38,INNER=A4W-2*PAD;
  async function measure(html){return new Promise(res=>{const f=document.createElement('iframe');
    f.style.cssText=`position:fixed;left:-10000px;top:0;width:${INNER}px;height:10px;border:0;visibility:hidden`;
    f.srcdoc=html.replace('</head>',`<style>html,body{margin:0!important;padding:0!important;max-width:none!important;width:${INNER}px}</style></head>`);
    f.onload=()=>{setTimeout(()=>{const h=f.contentDocument.documentElement.scrollHeight;f.remove();res(h)},80)};document.body.appendChild(f)})}
  async function ficheImage(html,scale){
    const css=(html.match(/<style>([\s\S]*?)<\/style>/)||['',''])[1].replace(/@page[^{]*\{[^}]*\}/g,'').replace(/@media print\{[^}]*\{[^}]*\}\}/g,'').replace(/(^|[}\s])body\{/g,'$1.fx{');
    const body=(html.match(/<body>([\s\S]*?)<\/body>/)||['',''])[1].replace(/<script[\s\S]*?<\/script>/g,'');
    const h=Math.max(1123,Math.ceil((await measure(html))+2*PAD));
    const wrap=document.createElement('div');wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
    wrap.innerHTML=`<style>${css}.fx{margin:0!important;padding:0!important;max-width:none!important;width:${INNER}px;background:#fff}</style><div class="fx">${body}</div>`;
    const xhtml=new XMLSerializer().serializeToString(wrap);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${A4W}" height="${h}"><rect width="100%" height="100%" fill="#fff"/><foreignObject x="${PAD}" y="${PAD}" width="${INNER}" height="${h-2*PAD}">${xhtml}</foreignObject></svg>`;
    const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
    const c=document.createElement('canvas');c.width=A4W*scale;c.height=h*scale;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.scale(scale,scale);x.drawImage(img,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));return{bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height}}
  function jpegPdf(jpg){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
    const push=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);len+=b.length};
    const wPt=595.28,hPt=+(wPt*jpg.h/jpg.w).toFixed(2),content=`q ${wPt} 0 0 ${hPt} 0 0 cm /Im0 Do Q`;
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const obj=(n,s)=>{offs[n]=len;push(`${n} 0 obj\n${s}\nendobj\n`)};
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wPt} ${hPt}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    offs[4]=len;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${jpg.w} /Height ${jpg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.bytes.length} >>\nstream\n`);push(jpg.bytes);push('\nendstream\nendobj\n');
    obj(5,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    const xref=len;push(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const out=new Uint8Array(len);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length});return out}
  async function fichePdf(html,name){const jpg=await ficheImage(html,2);return new File([jpegPdf(jpg)],name,{type:'application/pdf'})}
  const fileName=(kind,who,date)=>`${kind}-${String(who||'eleve').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'eleve'}-${date||iso(Date.now())}.pdf`;
  function downloadFile(file){const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
  /* ---------- kilométrage du véhicule (LLD) ---------- */
  function veh(){try{const o=JSON.parse(get(K.ve));return o&&o.contrat?o:null}catch(e){return null}}
  function vehSave(o){o.updatedAt=Date.now();set(K.ve,JSON.stringify(o))}
  const dayOf=s=>{const[y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)/DAY};
  function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}
  function vehStats(o,todayIso){o=o||veh();if(!o)return null;const c=o.contrat,start=c.debut,end=addMonths(c.debut,+c.duree||0);
    const s0=dayOf(start),s1=dayOf(end),tot=Math.max(1,s1-s0),allow=+c.km||0,dep=+c.depart||0,today=todayIso||iso(Date.now());
    const rel=[...(o.releves||[])].sort((a,b)=>a.date.localeCompare(b.date));const last=rel[rel.length-1]||null;
    const expAt=d=>allow*Math.min(1,Math.max(0,(dayOf(d)-s0)/tot));
    const r={start,end,allow,dep,tot,rel,last,perMonthContract:allow/(+c.duree||1),expAt,dayOf};
    if(!last){r.used=0;r.state='none';return r}
    const el=Math.max(0,dayOf(last.date)-s0);r.used=last.km-dep;r.expected=expAt(last.date);r.ecart=r.used-r.expected;
    r.state=r.ecart<=allow*.03?'ok':r.ecart<=allow*.07?'warn':'over';
    if(el>=14){r.rateDay=r.used/el;r.perMonth=r.rateDay*30.44;r.projected=Math.round(r.rateDay*tot);r.over=Math.max(0,r.projected-allow);r.cost=c.prix?r.over*(+String(c.prix).replace(',','.')):null}
    if(r.projected!=null)r.state=r.projected<=allow?'ok':r.projected<=allow*1.05?'warn':'over';
    const left=(s1-dayOf(last.date))/30.44;r.monthsLeft=left;r.needPerMonth=left>0?Math.max(0,(allow-r.used)/left):null;
    const lastDay=dayOf(last.date),t=dayOf(today);r.daysSince=t-lastDay;r.due=last.date.slice(0,7)<today.slice(0,7)||r.daysSince>=30;return r}
  syncAll();
  return{veh,vehSave,vehStats,backup,restore,check,lastText,setToast:f=>{toast=f},
    eleves,eleve,link,addEleve,updateEleve,deleteEleve,recordsOf,full,norm,fr,FIELDS,pickerHTML,
    setPicker:(p,c)=>{onPick=p;onClear=c},T,openShare,fichePdf,fileName,downloadFile,shareText,shareFile,DOCS,frDate:iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}};
})();
</script>
<script>

const G='#E4EDE6',ROAD='#646E78',SIDE='#D3DAE0',LOT='#6E7781',ISL='#BCD8C1',ISLS='#94BD9D',W='#FFFFFF',NAVY='#22416D',TEAL='#2A9DAE';

const PIECES={
  eleve:{l:'Élève',r:46,svg:()=>car(NAVY,{eleve:true})},

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const frDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const K_DRAFT='rc:tableau:draft',K_LIST='rc:dessins',K_PEN='rc:penOnly';
const VW=1200,VH=800;
const COLORS=[['#1C2B40','Noir'],['#1E5FB4','Bleu'],['#D6424A','Rouge'],['#2E8B57','Vert']];
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
RC.setToast(toast);

/* ---------- état ---------- */
const blankBoard=()=>({bg:'croix',strokes:[],pieces:[],curId:null,eleveId:null,title:''});
let B;try{B=JSON.parse(lsGet(K_DRAFT))}catch(e){B=null}
if(!B||!Array.isArray(B.strokes))B=blankBoard();
let tool='pen',color=COLORS[1][0],penOnly=lsGet(K_PEN)==='1',sel=null,undo=[],savedSig=null;
const content=()=>JSON.stringify({bg:B.bg,strokes:B.strokes,pieces:B.pieces});
const list=()=>{try{return JSON.parse(lsGet(K_LIST))||[]}catch(e){return[]}};
(function(){if(B.curId){const r=list().find(x=>x.id===B.curId);savedSig=r?JSON.stringify({bg:r.bg,strokes:r.strokes,pieces:r.pieces}):null;if(!r)B.curId=null}})();
let dT;function persist(){clearTimeout(dT);dT=setTimeout(()=>lsSet(K_DRAFT,JSON.stringify(B)),350);paintSave()}
function pushUndo(sig){undo.push(sig);if(undo.length>60)undo.shift();$('#undoBtn').disabled=false}

function paintTools(){document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===tool));
  document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color===color));
  $('#penBtn').setAttribute('aria-pressed',penOnly);$('#bgName').textContent=TB.bgName(B.bg);
  $('#stage').dataset.tool=tool}
function paintSave(){const b=$('#saveBtn');if(!b)return;const saved=B.curId&&savedSig===content();b.classList.toggle('ok',!!saved);b.querySelector('span').textContent=saved?'Enregistré ✓':'Enregistrer'}

/* ---------- plateau ---------- */
const stage=$('#stage'),svg=$('#svg'),ink=$('#ink'),ctx=ink.getContext('2d');
let sc=1;
function fit(){const wrap=$('#stagewrap'),top=wrap.getBoundingClientRect().top+scrollY,trayH=$('#tray').offsetHeight+16;
  const avail=Math.max(220,innerHeight-top-trayH-8);
  const w=Math.floor(Math.min(wrap.clientWidth,avail*1.5));stage.style.width=w+'px';stage.style.height=Math.round(w/1.5)+'px';sc=w/VW;
  const dpr=devicePixelRatio||1;ink.width=Math.round(w*dpr);ink.height=Math.round(w/1.5*dpr);redrawInk();renderSel()}
function renderBg(){$('#bgL').innerHTML=TB.bgSVG(B.bg)}
const pieceG=(p,hit)=>{const d=TB.PIECES[p.t];return `<g ${hit?`data-pid="${p.id}"`:''} transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${Math.round(p.r)})">${hit?`<circle r="${d.r+6}" fill="transparent"/>`:''}${d.svg()}</g>`};
function renderPieces(){$('#pcL').innerHTML=B.pieces.map(p=>pieceG(p,true)).join('');renderSel()}
function renderSel(){const g=$('#selL');const p=sel&&B.pieces.find(x=>x.id===sel);if(!p){g.innerHTML='';paintTray();return}
  const d=TB.PIECES[p.t],rr=d.r+6,hr=Math.max(14,22/sc),off=rr+Math.max(26,40/sc);
  g.innerHTML=`<g transform="translate(${p.x} ${p.y}) rotate(${p.r})"><circle r="${rr}" fill="none" stroke="#2A9DAE" stroke-width="${Math.max(2,2/sc)}" stroke-dasharray="${8/Math.max(sc,.5)} ${6/Math.max(sc,.5)}"/>
    <line x1="0" y1="${-rr}" x2="0" y2="${-off+hr}" stroke="#2A9DAE" stroke-width="${Math.max(2,2/sc)}"/>
    <circle data-rot="1" cx="0" cy="${-off}" r="${hr}" fill="#fff" stroke="#2A9DAE" stroke-width="${Math.max(3,3/sc)}"/>
    <path d="M${-hr*.45} ${-off-hr*.1} a${hr*.45} ${hr*.45} 0 1 1 ${hr*.3} ${hr*.42}" fill="none" stroke="#2A9DAE" stroke-width="${Math.max(2,2/sc)}" pointer-events="none"/></g>`;paintTray()}

/* tracé */
const widthAt=(s,p)=>s.t==='eraser'?36:(s.t==='arrow'?5.5:3.6)*(0.45+(p/100)*1.1);
function seg(c,s,a,b){c.globalCompositeOperation=s.t==='eraser'?'destination-out':'source-over';c.strokeStyle=s.c;c.fillStyle=s.c;c.lineCap='round';c.lineJoin='round';
  c.lineWidth=widthAt(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}
function head(c,s){const p=s.p,e=p[p.length-1];let i=p.length-2;while(i>0&&Math.hypot(e[0]-p[i][0],e[1]-p[i][1])<22)i--;const b=p[Math.max(0,i)];
  const a=Math.atan2(e[1]-b[1],e[0]-b[0]);if(!isFinite(a)||(e[0]===b[0]&&e[1]===b[1]))return;const L=24,Wd=11;
  c.globalCompositeOperation='source-over';c.fillStyle=s.c;c.beginPath();c.moveTo(e[0]+Math.cos(a)*6,e[1]+Math.sin(a)*6);
  c.lineTo(e[0]-Math.cos(a)*L+Math.cos(a+Math.PI/2)*Wd,e[1]-Math.sin(a)*L+Math.sin(a+Math.PI/2)*Wd);
  c.lineTo(e[0]-Math.cos(a)*L-Math.cos(a+Math.PI/2)*Wd,e[1]-Math.sin(a)*L-Math.sin(a+Math.PI/2)*Wd);c.closePath();c.fill()}
function drawStroke(c,s){const p=s.p;if(!p.length)return;
  if(p.length===1){c.globalCompositeOperation=s.t==='eraser'?'destination-out':'source-over';c.fillStyle=s.c;c.beginPath();c.arc(p[0][0],p[0][1],widthAt(s,p[0][2])/2,0,Math.PI*2);c.fill()}
  for(let i=1;i<p.length;i++)seg(c,s,p[i-1],p[i]);if(s.t==='arrow')head(c,s);c.globalCompositeOperation='source-over'}
function inkT(){ctx.setTransform(ink.width/VW,0,0,ink.height/VH,0,0)}
function redrawInk(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ink.width,ink.height);inkT();B.strokes.forEach(s=>drawStroke(ctx,s))}
function renderAll(){renderBg();renderPieces();redrawInk();paintTools();paintSave()}

/* ---------- pointeurs ---------- */
const toXY=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*VW/r.width,(e.clientY-r.top)*VH/r.height]};
let act=null;
stage.addEventListener('pointerdown',e=>{
  const isPen=e.pointerType==='pen';
  if(isPen&&!penOnly&&lsGet(K_PEN)!=='0'){penOnly=true;lsSet(K_PEN,'1');paintTools();toast('Stylet détecté : le stylet dessine, les doigts déplacent les éléments')}
  if(act){if(isPen&&act.touch){finish()}else return}
  const [x,y]=toXY(e),pEl=e.target.closest('[data-pid]'),rot=e.target.closest('[data-rot]');
  const canDraw=tool!=='move'&&(!penOnly||isPen||e.pointerType==='mouse');
  const sig=content();
  if(rot&&sel){act={k:'rot',id:sel,sig,touch:!isPen}}
  else if(pEl&&!canDraw||pEl&&tool==='move'){const p=B.pieces.find(q=>q.id===pEl.dataset.pid);if(!p)return;
    B.pieces=B.pieces.filter(q=>q!==p).concat(p);sel=p.id;renderPieces();act={k:'drag',id:p.id,dx:p.x-x,dy:p.y-y,sig,touch:!isPen}}
  else if(canDraw){const pr=e.pressure&&e.pointerType!=='mouse'?e.pressure:.5;
    const s={t:tool,c:tool==='eraser'?'#000':color,p:[[+x.toFixed(1),+y.toFixed(1),Math.round(pr*100)]]};B.strokes.push(s);inkT();drawStroke(ctx,s);act={k:'draw',s,sig,touch:!isPen};if(sel){sel=null;renderSel()}}
  else{if(sel){sel=null;renderSel()}return}
  act.pid=e.pointerId;try{stage.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();
});
stage.addEventListener('pointermove',e=>{if(!act||e.pointerId!==act.pid)return;e.preventDefault();
  let evs=act.k==='draw'&&e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs||!evs.length)evs=[e];
  if(act.k==='draw'){inkT();evs.forEach(ev=>{const[x,y]=toXY(ev),p=act.s.p,l=p[p.length-1];if(Math.hypot(x-l[0],y-l[1])<1.4)return;
      const pr=ev.pressure&&ev.pointerType!=='mouse'?ev.pressure:.5;const n=[+x.toFixed(1),+y.toFixed(1),Math.round(pr*100)];p.push(n);seg(ctx,act.s,l,n)});ctx.globalCompositeOperation='source-over'}
  else{const[x,y]=toXY(e),p=B.pieces.find(q=>q.id===act.id);if(!p)return;
    if(act.k==='drag'){p.x=Math.max(0,Math.min(VW,x+act.dx));p.y=Math.max(0,Math.min(VH,y+act.dy))}
    else{let a=Math.atan2(x-p.x,-(y-p.y))*180/Math.PI;const sn=Math.round(a/15)*15;if(Math.abs(a-sn)<5)a=sn;p.r=(a+360)%360}
    const g=$(`[data-pid="${p.id}"]`);if(g)g.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${Math.round(p.r)})`);renderSel()}
});
function finish(){if(!act)return;const a=act;act=null;
  if(a.k==='draw'){if(a.s.t==='arrow'){redrawInk()}if(a.s.t==='eraser'&&!B.strokes.some(s=>s!==a.s&&s.t!=='eraser')){B.strokes.pop();redrawInk()}}
  if(content()!==a.sig){pushUndo(a.sig);persist()}}
stage.addEventListener('pointerup',e=>{if(act&&e.pointerId===act.pid)finish()});
stage.addEventListener('pointercancel',e=>{if(act&&e.pointerId===act.pid)finish()});
stage.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- barre d’éléments ---------- */
let trayFor;function paintTray(force){const t=$('#tray');const p=sel&&B.pieces.find(x=>x.id===sel);const key=p?p.id:'';if(!force&&key===trayFor)return;trayFor=key;
  t.innerHTML=(p?`<span class="selg"><span class="trl">${esc(TB.PIECES[p.t].l)}</span>
    <button type="button" class="tb" data-act="rl" aria-label="Tourner à gauche">↺<span>45°</span></button><button type="button" class="tb" data-act="rr" aria-label="Tourner à droite">↻<span>45°</span></button>
    <button type="button" class="tb" data-act="dup"><span>Dupliquer</span></button><button type="button" class="tb danger" data-act="del"><span>Supprimer</span></button>
    <button type="button" class="tb" data-act="ok"><span>OK</span></button></span><span class="sep"></span>`:'')+Object.entries(TB.PIECES).map(([k,d])=>`<button type="button" class="pc" data-add="${k}" title="Ajouter : ${esc(d.l)}"><svg viewBox="-${d.r} -${d.r} ${d.r*2} ${d.r*2}">${d.svg()}</svg><span>${esc(d.l)}</span></button>`).join('')}
$('#tray').addEventListener('click',e=>{const a=e.target.closest('[data-add]'),b=e.target.closest('[data-act]');
  if(a){const sig=content(),n=B.pieces.length%6;const p={id:newId('p'),t:a.dataset.add,x:VW/2-150+n*60,y:VH/2-60+(n%3)*50,r:0};B.pieces.push(p);sel=p.id;
    if(!penOnly){tool='move';paintTools()}renderPieces();pushUndo(sig);persist();
    if(!penOnly)toast('Faites glisser l’élément. Reprenez le stylo pour dessiner.');return}
  if(!b)return;const p=B.pieces.find(x=>x.id===sel);if(!p)return;const sig=content();
  switch(b.dataset.act){case 'rl':p.r=(p.r+315)%360;break;case 'rr':p.r=(p.r+45)%360;break;
    case 'dup':{const q=Object.assign({},p,{id:newId('p'),x:Math.min(VW-30,p.x+50),y:Math.min(VH-30,p.y+30)});B.pieces.push(q);sel=q.id;break}
    case 'del':B.pieces=B.pieces.filter(x=>x!==p);sel=null;break;case 'ok':sel=null;renderSel();return}
  renderPieces();pushUndo(sig);persist()});

/* ---------- barre d’outils ---------- */
$('#tbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.tool){tool=b.dataset.tool;if(tool!=='move'&&sel){sel=null;renderSel()}paintTools();return}
  if(b.dataset.color){color=b.dataset.color;if(tool==='eraser'||tool==='move')tool='pen';paintTools();return}
  switch(b.id){
    case 'undoBtn':{const s=undo.pop();if(!s)break;const o=JSON.parse(s);B.bg=o.bg;B.strokes=o.strokes;B.pieces=o.pieces;sel=null;renderAll();persist();$('#undoBtn').disabled=!undo.length;break}
    case 'clearBtn':sheet('Effacer',`<button type="button" class="btn" data-clr="ink">Effacer les traits</button><button type="button" class="btn" data-clr="all">Tout effacer (traits et éléments)</button>`);break;
    case 'penBtn':penOnly=!penOnly;lsSet(K_PEN,penOnly?'1':'0');paintTools();toast(penOnly?'Stylet seul : le stylet dessine, les doigts déplacent les éléments':'Le doigt peut aussi dessiner');break;
    case 'fullBtn':toggleFocus();break;
    case 'bgBtn':sheet('Choisir un fond',`<div class="bgs">${TB.BG.map(([k,l])=>`<button type="button" class="bgt${k===B.bg?' on':''}" data-bg="${k}"><svg viewBox="0 0 1200 800">${TB.bgSVG(k)}</svg><span>${esc(l)}</span></button>`).join('')}</div>`,true);break;
    case 'saveBtn':saveSheet();break;
    case 'shareBtn':share();break;
    case 'openBtn':openSheet();break;
  }});
function toggleFocus(){const on=!document.body.classList.contains('focus');document.body.classList.toggle('focus',on);$('#fullBtn span').textContent=on?'Réduire':'Agrandir';
  try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  setTimeout(fit,120)}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('focus')){document.body.classList.remove('focus');$('#fullBtn span').textContent='Agrandir';setTimeout(fit,120)}});

/* ---------- fenêtres ---------- */
let sh=null;
function sheet(title,html,wide){closeSheet();const el=document.createElement('div');el.className='shm';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',title);
  el.innerHTML=`<div class="shm-in${wide?' wide':''}"><div class="shm-h"><b>${esc(title)}</b><button type="button" class="shm-x" data-x aria-label="Fermer">✕</button></div>${html}</div>`;
  document.body.appendChild(el);sh=el;el.addEventListener('click',onSheet);el.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});setTimeout(()=>el.querySelector('.shm-x').focus(),40);return el}
function closeSheet(){if(sh){sh.remove();sh=null}}
function onSheet(e){const t=e.target;if(t===sh||t.closest('[data-x]')){closeSheet();return}
  const c=t.closest('[data-clr]');if(c){const sig=content();B.strokes=[];if(c.dataset.clr==='all'){B.pieces=[];sel=null}if(content()!==sig){pushUndo(sig);persist()}renderAll();closeSheet();toast('Effacé : touchez Annuler pour revenir');return}
  const g=t.closest('[data-bg]');if(g){const sig=content(),k=g.dataset.bg;if(k!==B.bg||B.strokes.length||B.pieces.length){B.bg=k;B.strokes=[];B.pieces=[];sel=null;B.curId=null;B.title='';savedSig=null;pushUndo(sig);persist()}
    renderAll();closeSheet();if(sig!==content()&&JSON.parse(sig).strokes.length)toast('Nouveau fond : touchez Annuler pour retrouver le dessin précédent');return}
  const o=t.closest('[data-open]');if(o){const r=list().find(x=>x.id===o.dataset.open);if(!r)return;const sig=content();
    Object.assign(B,{bg:r.bg,strokes:r.strokes,pieces:r.pieces,curId:r.id,eleveId:r.eleveId||null,title:r.title||''});savedSig=content();sel=null;if(sig!==content())pushUndo(sig);persist();renderAll();closeSheet();toast('Schéma ouvert');return}
  const d=t.closest('[data-delsch]');if(d){const l=list(),r=l.find(x=>x.id===d.dataset.delsch);if(!r||!confirm(`Supprimer le schéma « ${r.title||TB.bgName(r.bg)} » ?`))return;
    lsSet(K_LIST,JSON.stringify(l.filter(x=>x!==r)));if(B.curId===r.id){B.curId=null;savedSig=null;persist()}openSheet();toast('Schéma supprimé');return}
  if(t.closest('[data-new]')){const sig=content();Object.assign(B,blankBoard(),{bg:B.bg});savedSig=null;sel=null;if(sig!==content())pushUndo(sig);persist();renderAll();closeSheet();toast('Nouveau schéma');return}
  if(t.closest('[data-dosave]'))doSave();
}
function eleveOptions(cur){const l=RC.eleves().sort((a,b)=>RC.full(a).localeCompare(RC.full(b),'fr'));
  return `<option value="">Sans élève</option>`+l.map(e=>`<option value="${esc(e.id)}"${e.id===cur?' selected':''}>${esc(RC.full(e))}</option>`).join('')}
function saveSheet(){sheet(B.curId?'Enregistrer les modifications':'Enregistrer le schéma',`<label class="f">Titre<input type="text" id="svTitle" value="${esc(B.title||TB.bgName(B.bg))}" autocomplete="off"></label>
  <label class="f">Dossier de l’élève<select id="svEl">${eleveOptions(B.eleveId)}</select></label>
  <p class="shm-note">Le schéma est gardé sur cet appareil${RC.eleves().length?' et apparaît dans le dossier de l’élève':''}.</p>
  <button type="button" class="btn primary" data-dosave>Enregistrer</button>`)}
async function doSave(){const title=$('#svTitle').value.trim()||TB.bgName(B.bg),eleveId=$('#svEl').value||null,btn=sh.querySelector('[data-dosave]');btn.disabled=true;btn.textContent='Enregistrement…';
  try{const thumb=(await renderBoard(.34,false)).toDataURL('image/jpeg',.72);const l=list(),now=Date.now();let r=B.curId&&l.find(x=>x.id===B.curId);
    if(!r){r={v:1,id:newId('sc'),createdAt:now,date:todayISO()};l.push(r)}
    Object.assign(r,{updatedAt:now,title,eleveId,bg:B.bg,strokes:B.strokes,pieces:B.pieces,thumb});
    if(!lsSet(K_LIST,JSON.stringify(l))){toast('Mémoire pleine : supprimez d’anciens schémas');btn.disabled=false;btn.textContent='Enregistrer';return}
    B.curId=r.id;B.eleveId=eleveId;B.title=title;savedSig=content();persist();closeSheet();const e=RC.eleve(eleveId);toast(e?'Schéma enregistré dans le dossier de '+RC.full(e):'Schéma enregistré');RC.check()}
  catch(err){toast('Impossible d’enregistrer le schéma');btn.disabled=false;btn.textContent='Enregistrer'}}
function openSheet(){const l=list().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  sheet('Mes schémas',`<button type="button" class="btn primary" data-new>Nouveau schéma</button>`+(l.length?`<div class="scl">${l.map(r=>{const e=RC.eleve(r.eleveId);
    return `<div class="sci"><button type="button" class="sco" data-open="${esc(r.id)}"><img src="${r.thumb}" alt=""><span><b>${esc(r.title||TB.bgName(r.bg))}</b><small>${esc(frDate(r.date))}${e?', '+esc(RC.full(e)):''}</small></span></button><button type="button" class="scd" data-delsch="${esc(r.id)}" aria-label="Supprimer">✕</button></div>`}).join('')}</div>`:
    `<p class="shm-note">Aucun schéma enregistré pour l’instant.</p>`),true)}

/* ---------- image (partage) ---------- */
let logoImg=null;
async function renderBoard(scale,footer){const F=footer?100:0,c=document.createElement('canvas');c.width=Math.round(VW*scale);c.height=Math.round((VH+F)*scale);
  const x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#fff';x.fillRect(0,0,VW,VH+F);
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${VW}" height="${VH}" viewBox="0 0 ${VW} ${VH}">${TB.bgSVG(B.bg)}${B.pieces.map(p=>pieceG(p,false)).join('')}</svg>`;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);await img.decode();x.drawImage(img,0,0,VW,VH);
  const ic=document.createElement('canvas');ic.width=c.width;ic.height=Math.round(VH*scale);const ix=ic.getContext('2d');ix.setTransform(scale,0,0,scale,0,0);B.strokes.forEach(st=>drawStroke(ix,st));x.drawImage(ic,0,0,VW,VH);
  if(footer){const gr=x.createLinearGradient(0,0,VW,0);gr.addColorStop(0,'#22416D');gr.addColorStop(.55,'#2A9DAE');gr.addColorStop(1,'#8CC89F');x.fillStyle=gr;x.fillRect(0,VH,VW,5);
    if(!logoImg){logoImg=new Image();logoImg.src=LOGO;await logoImg.decode()}x.drawImage(logoImg,22,VH+18,70,70);
    x.fillStyle='#22416D';x.font='800 30px Montserrat, Arial, sans-serif';x.fillText('Rousseau Conduite',108,VH+52);
    const e=RC.eleve(B.eleveId);x.fillStyle='#23798A';x.font='700 21px "Atkinson Hyperlegible", Arial, sans-serif';
    x.fillText([B.title||TB.bgName(B.bg),e?RC.full(e):null,frDate(todayISO())].filter(Boolean).join('  ·  '),108,VH+84)}
  return c}
async function pngFile(){const c=await renderBoard(1.6,true);const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const slug=String(B.title||TB.bgName(B.bg)).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
  return new File([blob],`schema-${slug||'rousseau-conduite'}-${todayISO()}.png`,{type:'image/png'})}
function share(){const e=RC.eleve(B.eleveId),T=RC.T,p=e&&e.prenom;
  RC.openShare({title:'Partager le schéma',tel:(e&&e.tel)||'',attach:{title:'Joindre le schéma en image',kind:'Image',label:(B.title||TB.bgName(B.bg))+', image PNG',make:pngFile},templates:[{id:'sch',label:'Schéma',build:tu=>
    [`Bonjour${p?' '+p:''},`,'',`Voici le schéma${B.title||B.bg!=='blank'?` « ${B.title||TB.bgName(B.bg)} »`:''} vu ensemble pendant la leçon.`,
     `${T(tu,'Garde-le','Gardez-le')} pour ${T(tu,'le revoir','le revoir')} avant la prochaine leçon.`,'','Rousseau Conduite'].join('\n')}]})}

/* ---------- démarrage ---------- */
(function(){const qp=new URLSearchParams(location.search),o=qp.get('open'),el=qp.get('eleve');
  if(o){const r=list().find(x=>x.id===o);if(r){Object.assign(B,{bg:r.bg,strokes:r.strokes,pieces:r.pieces,curId:r.id,eleveId:r.eleveId||null,title:r.title||''});savedSig=content();persist()}}
  else if(el&&RC.eleve(el)){if(B.strokes.length||B.pieces.length){if(B.eleveId!==el){const sig=content();Object.assign(B,blankBoard(),{bg:B.bg,eleveId:el});savedSig=null;pushUndo(sig)}}else{B.eleveId=el;B.curId=null}persist()}
  if(qp.toString())history.replaceState(null,'',location.pathname)})();
renderAll();paintTray(true);
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(fit,120)});
setTimeout(fit,30);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
RC.check();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{if(navigator.onLine&&r.active)r.active.postMessage('fonts')}).catch(()=>{}));
})();
</script>
</body>
