<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22416D">
<link rel="manifest" href="carnet.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet de route">
<title>Carnet de route | Rousseau Conduite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F5;--surface:#FFFFFF;--ink:#1C2B40;--muted:#5A6B7C;--line:#D2DDE3;--chip:#E2EBEF;--navy:#22416D;--navy-ink:#FFFFFF;--teal:#2A9DAE;--green:#8CC89F;--tealtext:#23798A;
  --c-ville:#22416D;--c-camp:#2A9DAE;--c-rap:#8CC89F;
  --display:"Montserrat","Segoe UI",Arial,sans-serif;--body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;--navy:#2D5A94;--tealtext:#5CC3D2;--c-ville:#6F9BD6;--c-camp:#3AAFC0;--c-rap:#8CC89F}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.bar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--green))}
.bar-in{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.brand{flex:1;min-width:0;line-height:1.15}.brand b{display:block;font-family:var(--display);font-weight:800;color:var(--navy)}
@media (prefers-color-scheme:dark){.brand b{color:#fff}}
.brand span{font-size:.82rem;color:var(--tealtext);font-weight:700}
.icb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.icb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:4px 0 4px}
h2{font-family:var(--display);font-weight:700;font-size:1.02rem;margin:0 0 10px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);min-height:46px}
textarea{min-height:70px;resize:vertical}
.lab{font-size:.84rem;color:var(--muted);font-weight:700;margin:12px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;min-height:42px;cursor:pointer;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.seg.multi button[aria-pressed="true"]::before{content:"✓ "}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.quiet{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.6}
.safe{display:flex;gap:10px;align-items:flex-start;background:#FFF4D6;border:1px solid #E9B949;color:#4A3800;border-radius:14px;padding:10px 12px;font-size:.88rem;margin:0 0 12px}
@media (prefers-color-scheme:dark){.safe{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}}
/* tableau de bord */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px;margin:0 0 12px}
@media (prefers-color-scheme:dark){.hero{background:#22416D}}
.hero .who{font-weight:700;opacity:.92;font-size:.92rem}
.hero .km{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}.hero .km b{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}.hero .km span{font-weight:700;opacity:.85}
.track{height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:10px 0 6px}.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--green))}
.hero small{opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{display:block;font-size:.76rem;color:var(--muted);font-weight:700}.tile b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}.tile b small{font-size:.75rem;color:var(--muted);font-family:var(--body)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip);gap:2px}.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:8px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rdv{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.rdv:first-of-type{border-top:0}
.rdv .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;background:var(--muted)}.rdv .dot.ok{background:#3E9A62}
.trip{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.trip:first-of-type{border-top:0}
.trip .d{min-width:3.6rem;font-weight:700}.trip .d small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.trip .m{flex:1;min-width:0;display:flex;flex-direction:column}.trip .m small{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip .k{font-family:var(--display);font-weight:800;font-size:1.15rem;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:14px 4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:16px 26px;font-weight:800;font-family:var(--display);font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* fenêtres */
.shm{position:fixed;inset:0;z-index:30;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.shm{align-items:center}}
.shm-in{background:var(--surface);color:var(--ink);width:100%;max-width:600px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.shm-in{border-radius:18px}}
.shm-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.shm-h b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.shm-x{background:var(--chip);border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1rem;color:var(--ink)}
.kmmode{margin:0 0 8px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;font-size:1.9rem;line-height:1;cursor:pointer;color:var(--line);padding:2px}.stars button.on{color:#E0A12E}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--chip);border-color:var(--teal);font-weight:700}
.row2{display:flex;gap:8px;margin-top:14px}.row2 .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.install{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:.9rem;margin:0 0 12px}
</style>
</head>

const K='carnet:data';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const frDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const shortDate=iso=>{if(!iso)return '';const d=new Date(iso+'T12:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
const nkm=n=>Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ');
const hmin=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?' '+String(r).padStart(2,'0'):''}`:`${r} min`};
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}

const save=()=>{C.updatedAt=Date.now();if(!set(K,JSON.stringify(C)))toast('Mémoire du téléphone pleine')};

/* ---------- calculs ---------- */
function stats(){const t=C.trips,s={km:0,dur:0,n:t.length,nuit:0,pluie:0,routes:{ville:0,campagne:0,rapide:0},man:{}};
  t.forEach(x=>{const k=+x.km||0;s.km+=k;s.dur+=+x.dur||0;if((x.cond||[]).includes('nuit'))s.nuit+=k;if((x.cond||[]).some(c=>c==='pluie'||c==='brouillard'))s.pluie+=k;
    const r=(x.routes||[]).filter(r=>r in s.routes);r.forEach(q=>s.routes[q]+=k/r.length);(x.man||[]).forEach(m=>s.man[m]=(s.man[m]||0)+1)});
  s.obj=+C.profil.objectif||0;s.pct=s.obj?Math.min(100,s.km/s.obj*100):0;return s}

/* ---------- premier lancement ---------- */

    <div class="row2"><button type="submit" class="btn primary">${C?'Enregistrer':'Commencer mon carnet'}</button>${C?'<button type="button" class="btn quiet" data-back>Annuler</button>':''}</div></form>

    `<p class="muted" style="font-size:.9rem">Vous changez de téléphone ? <button type="button" class="btn quiet" data-restore style="min-height:40px;padding:6px 10px">Restaurer une sauvegarde</button></p>`}
  <input type="file" id="restoreF" accept=".txt,.json,text/plain,application/json" hidden>`}

/* ---------- tableau de bord ---------- */
function homeView(){const s=stats(),p=C.profil;$('#fab').hidden=false;$('#setBtn').hidden=false;
  const RV=p.formule==='aac'?rdvList(p,s.km):[];
  const last=[...C.trips].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const rt=s.routes,tot=rt.ville+rt.campagne+rt.rapide;
  $('#view').innerHTML=`
  <div class="safe"><span aria-hidden="true">⚠</span><span>On ne touche jamais au téléphone en conduisant : notez le trajet une fois la voiture arrêtée.</span></div>
  ${isStandalone()?'':`<div class="install"><b>Astuce :</b> ajoutez ce carnet à votre écran d’accueil. Android : menu ⋮ puis « Installer l’application ». iPhone : bouton Partager puis « Sur l’écran d’accueil ».</div>`}
  <div class="hero"><div class="who">${esc([p.prenom,p.nom].filter(Boolean).join(' '))} · ${esc(FORMULE[p.formule]||'')}</div>
    <div class="km"><b>${nkm(s.km)}</b><span>km${s.obj?` sur ${nkm(s.obj)}`:''}</span></div>
    ${s.obj?`<div class="track" role="img" aria-label="${Math.round(s.pct)} % de l’objectif"><i style="width:${s.pct}%"></i></div><small>${s.km>=s.obj?'Objectif atteint, bravo !':`Encore ${nkm(s.obj-s.km)} km`} · depuis le ${frDate(p.debut)}</small>`:`<small>depuis le ${frDate(p.debut)}</small>`}</div>
  <div class="tiles"><div class="tile"><span>Trajets</span><b>${s.n}</b></div><div class="tile"><span>Temps</span><b>${hmin(s.dur)}</b></div>
    <div class="tile"><span>De nuit</span><b>${nkm(s.nuit)}<small> km</small></b></div><div class="tile"><span>Pluie, brouillard</span><b>${nkm(s.pluie)}<small> km</small></b></div></div>
  <div class="block"><h2>Types de routes</h2>${tot?`<div class="split" role="img" aria-label="Répartition des kilomètres par type de route">${ROUTES.map(([k])=>rt[k]?`<i style="width:${rt[k]/tot*100}%;background:var(--c-${k==='ville'?'ville':k==='campagne'?'camp':'rap'})"></i>`:'').join('')}</div>
    <div class="legend">${ROUTES.map(([k,l])=>`<span><i style="background:var(--c-${k==='ville'?'ville':k==='campagne'?'camp':'rap'})"></i>${l} : <b>${nkm(rt[k])} km</b></span>`).join('')}</div>`:'<p class="muted" style="margin:0">Notez vos premiers trajets pour voir la répartition.</p>'}</div>
  ${RV.length?`<div class="block"><h2>Rendez-vous pédagogiques</h2>${RV.map((r,i)=>`<div class="rdv"><span class="dot${r.ok?' ok':''}">${r.ok?'✓':i+1}</span><span><b>${r.t}</b><br><small class="muted">${r.sub}</small></span></div>`).join('')}
    <p class="muted" style="margin:8px 0 0;font-size:.85rem">Avant chaque rendez-vous, touchez « Envoyer à mon moniteur ».</p></div>`:''}
  <div class="acts" style="margin:0 0 12px"><button type="button" class="btn primary" data-send style="grid-column:1/-1">Envoyer à mon moniteur</button></div>

    <span class="m"><b>${esc((t.routes||[]).map(r=>(ROUTES.find(x=>x[0]===r)||[,''])[1]).join(', ')||'Trajet')}</b><small>${t.note?`<span style="color:#E0A12E" aria-label="${t.note} sur 5">${'★'.repeat(t.note)}</span> `:''}${esc([t.acc,...(t.cond||[]).map(c=>(CONDS.find(x=>x[0]===c)||[,''])[1])].filter(Boolean).join(' · '))}</small></span>
    <span class="k">${nkm(t.km)} km</span></button>`).join(''):'<p class="empty">Aucun trajet pour l’instant.<br>Touchez « Nouveau trajet » après votre première conduite.</p>'}</div>`}
/* rendez-vous pédagogiques (conduite accompagnée) : le 1er à 1 500 km ou au bout de 6 mois, le 2e à 3 000 km */
function addMonths(iso,n){const d=new Date((iso||todayISO())+'T12:00');const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return d.toISOString().slice(0,10)}
function rdvList(p,km){const d6=addMonths(p.debut,6),ok1=km>=1500||todayISO()>=d6,ok2=km>=3000;
  return[{t:'1er rendez-vous pédagogique',ok:ok1,sub:ok1?`${km>=1500?'1 500 km atteints':'6 mois atteints'} : c’est le moment, prévenez votre moniteur`:`à 1 500 km ou le ${frDate(d6)} (le premier des deux) · encore ${nkm(1500-km)} km`},
    {t:'2e rendez-vous pédagogique',ok:ok2,sub:ok2?'3 000 km atteints : prévenez votre moniteur':`à 3 000 km, en fin d’apprentissage · encore ${nkm(3000-km)} km`}]}
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function render(){if(!C)setupView();else homeView()}

/* ---------- saisie d’un trajet ---------- */
let sheet=null;
function tripSheet(id){const t=id?C.trips.find(x=>x.id===id):null,p=C.profil;
  const lastArr=[...C.trips].filter(x=>x.arr).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))[0];
  const d=t?JSON.parse(JSON.stringify(t)):{id:null,date:todayISO(),km:'',dur:null,dep:lastArr?lastArr.arr:'',arr:'',mode:C.lastMode||'km',routes:[],cond:[],man:[],acc:(p.accomp||[])[0]||'',note:0,com:''};
  if(!d.mode)d.mode=d.dep||d.arr?'cpt':'km';
  const el=document.createElement('div');el.className='shm';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const seg=(k,opts,multi)=>`<div class="seg${multi?' multi':''}" data-f="${k}" ${multi?'data-multi':''}>${opts.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${multi?d[k].includes(v):d[k]===v}">${esc(l)}</button>`).join('')}</div>`;
  const paint=()=>{el.querySelector('.shm-in').innerHTML=`<div class="shm-h"><b>${t?'Modifier le trajet':'Nouveau trajet'}</b><button type="button" class="shm-x" data-x aria-label="Fermer">✕</button></div>
    <div class="grid"><label class="f">Date<input type="date" data-in="date" value="${esc(d.date)}" max="${todayISO()}"></label>
    <label class="f">Durée (minutes)<input type="number" data-in="dur" inputmode="numeric" min="0" value="${esc(d.dur??'')}" placeholder="Ex. : 45"></label></div>
    <div class="chips" style="margin-top:6px">${[15,30,45,60,90,120].map(m=>`<button type="button" data-dur="${m}" aria-pressed="${+d.dur===m}">${hmin(m)}</button>`).join('')}</div>
    <div class="lab">Kilomètres</div>${seg('mode',[['km','Distance'],['cpt','Compteur départ / arrivée']])}
    <div class="grid" style="margin-top:8px">${d.mode==='km'?`<label class="f full">Distance parcourue (km)<input type="number" data-in="km" inputmode="decimal" min="0" step="0.1" value="${esc(d.km)}" placeholder="Ex. : 32"></label>`:
      `<label class="f">Compteur au départ<input type="number" data-in="dep" inputmode="numeric" min="0" value="${esc(d.dep)}"></label><label class="f">Compteur à l’arrivée<input type="number" data-in="arr" inputmode="numeric" min="0" value="${esc(d.arr)}"></label>
      <p class="muted full" style="margin:0;font-size:.88rem" data-kmcalc>${+d.arr>+d.dep?`Distance : <b>${nkm(d.arr-d.dep)} km</b>`:'La distance se calcule toute seule.'}</p>`}</div>
    <div class="lab">Type de route <span style="font-weight:400">(plusieurs choix possibles)</span></div>${seg('routes',ROUTES,true)}
    <div class="lab">Conditions</div>${seg('cond',CONDS,true)}
    <div class="lab">Manœuvres</div>${seg('man',MANS.map(m=>[m,m]),true)}
    <div class="lab">Accompagnateur</div>${(p.accomp||[]).length?seg('acc',p.accomp.map(a=>[a,a])):`<input type="text" data-in="acc" value="${esc(d.acc)}" placeholder="Nom de l’accompagnateur">`}
    <div class="lab">Note de l’accompagnateur</div><div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" class="${n<=d.note?'on':''}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join('')}</div>
    <label class="f" style="margin-top:10px">Commentaire<textarea data-in="com" placeholder="Ce qui s’est bien passé, ce qu’il faut revoir…">${esc(d.com)}</textarea></label>
    <div class="row2"><button type="button" class="btn primary" data-save>Enregistrer le trajet</button>${t?'<button type="button" class="btn quiet" data-del style="color:#C0333A">Supprimer</button>':''}</div>`};
  el.innerHTML='<div class="shm-in"></div>';paint();document.body.appendChild(el);sheet=el;document.documentElement.style.overflow='hidden';
  const close=()=>{el.remove();sheet=null;document.documentElement.style.overflow=''};
  el.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;d[k]=e.target.value;
    if(k==='dep'||k==='arr'){const c=el.querySelector('[data-kmcalc]');if(c)c.innerHTML=+d.arr>+d.dep?`Distance : <b>${nkm(d.arr-d.dep)} km</b>`:'La distance se calcule toute seule.'}
    if(k==='dur')el.querySelectorAll('[data-dur]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.dur===+d.dur))});
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target===el){close();return}if(!b)return;
    if(b.dataset.x!=null){close();return}
    if(b.dataset.dur){d.dur=+b.dataset.dur;el.querySelector('[data-in="dur"]').value=d.dur;el.querySelectorAll('[data-dur]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
    if(b.dataset.star){const n=+b.dataset.star;d.note=d.note===n?0:n;el.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=d.note));return}
    const g=b.closest('[data-f]');if(g){const k=g.dataset.f,v=b.dataset.v;
      if(g.hasAttribute('data-multi')){const i=d[k].indexOf(v);i>=0?d[k].splice(i,1):d[k].push(v);b.setAttribute('aria-pressed',d[k].includes(v))}
      else{d[k]=v;if(k==='mode'){paint();return}g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}return}
    if(b.dataset.del!=null){if(!confirm('Supprimer ce trajet ?'))return;C.trips=C.trips.filter(x=>x.id!==t.id);save();close();render();toast('Trajet supprimé');return}
    if(b.dataset.save!=null){let km=d.mode==='cpt'?(+d.arr)-(+d.dep):+String(d.km).replace(',','.');
      if(d.mode==='cpt'&&(!d.arr||!d.dep||!(km>0))){toast('Vérifiez les compteurs : l’arrivée doit être plus grande que le départ');return}
      if(!(km>0)){toast('Indiquez la distance parcourue');return}
      if(km>1500){toast('Distance trop grande : vérifiez le chiffre');return}
      const rec={id:t?t.id:newId(),date:d.date||todayISO(),km:Math.round(km*10)/10,dur:d.dur===''||d.dur==null?null:+d.dur,dep:d.mode==='cpt'?+d.dep:null,arr:d.mode==='cpt'?+d.arr:null,mode:d.mode,
        routes:d.routes,cond:d.cond,man:d.man,acc:(d.acc||'').trim(),note:d.note||0,com:(d.com||'').trim()};
      if(t)Object.assign(t,rec);else C.trips.push(rec);C.lastMode=d.mode;save();close();render();window.scrollTo(0,0);toast(`Trajet enregistré : ${nkm(rec.km)} km`)}});
  el.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

/* ---------- envoi au moniteur ---------- */
let logoImg=null;
async function summaryCanvas(){try{await Promise.all([document.fonts.load('800 52px Montserrat'),document.fonts.load('700 32px Montserrat')])}catch(e){}
  const s=stats(),p=C.profil,W=1080,H=1500,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#22416D');g.addColorStop(.55,'#2A9DAE');g.addColorStop(1,'#8CC89F');x.fillStyle=g;x.fillRect(0,196,W,8);
  if(!logoImg){logoImg=new Image();logoImg.src=LOGO;await logoImg.decode()}x.drawImage(logoImg,60,50,120,120);
  const T=(t,px,py,font,col,align='left')=>{x.font=font;x.fillStyle=col;x.textAlign=align;x.fillText(t,px,py)};
  T('Carnet de route',210,110,'800 52px Montserrat, Arial, sans-serif','#22416D');T('Rousseau Conduite',210,160,'700 32px Arial, sans-serif','#23798A');
  T([p.prenom,p.nom].filter(Boolean).join(' '),60,290,'800 48px Montserrat, Arial, sans-serif','#1C2B40');
  T(`${FORMULE[p.formule]||''} · depuis le ${frDate(p.debut)}`,60,340,'400 30px Arial, sans-serif','#5A6B7C');
  x.fillStyle='#22416D';x.beginPath();x.roundRect?x.roundRect(60,380,W-120,250,28):x.rect(60,380,W-120,250);x.fill();
  T(nkm(s.km),100,500,'800 110px Montserrat, Arial, sans-serif','#FFFFFF');const kw=x.measureText(nkm(s.km)).width;
  T(`km${s.obj?' sur '+nkm(s.obj):''}`,110+kw,500,'700 38px Arial, sans-serif','#DCE8EE');
  if(s.obj){x.fillStyle='rgba(255,255,255,.22)';x.fillRect(100,540,W-200,22);x.fillStyle='#8CC89F';x.fillRect(100,540,(W-200)*s.pct/100,22);
    T(s.km>=s.obj?'Objectif atteint':`${Math.round(s.pct)} % de l’objectif`,100,605,'700 28px Arial, sans-serif','#FFFFFF')}
  const tiles=[['Trajets',String(s.n)],['Temps',hmin(s.dur)],['De nuit',nkm(s.nuit)+' km'],['Pluie, brouillard',nkm(s.pluie)+' km']];
  tiles.forEach(([l,v],i)=>{const tx=60+i*((W-120)/4);x.fillStyle='#EEF3F5';x.fillRect(tx+4,660,(W-120)/4-8,130);T(l,tx+22,705,'700 24px Arial, sans-serif','#5A6B7C');T(v,tx+22,765,'800 40px Montserrat, Arial, sans-serif','#1C2B40')});
  T('Types de routes',60,860,'800 32px Montserrat, Arial, sans-serif','#22416D');
  const rt=s.routes,tot=rt.ville+rt.campagne+rt.rapide,cols={ville:'#22416D',campagne:'#2A9DAE',rapide:'#8CC89F'};
  let bx=60;if(tot){ROUTES.forEach(([k])=>{const w=(W-120)*rt[k]/tot;if(w>0){x.fillStyle=cols[k];x.fillRect(bx,885,Math.max(0,w-3),30);bx+=w}})}else{x.fillStyle='#E2EBEF';x.fillRect(60,885,W-120,30)}
  ROUTES.forEach(([k,l],i)=>{const lx=60+i*320;x.fillStyle=cols[k];x.fillRect(lx,945,24,24);T(`${l.replace(' / autoroute','')} : ${nkm(rt[k])} km`,lx+34,966,'400 25px Arial, sans-serif','#1C2B40')});
  const mans=Object.entries(s.man).sort((a,b)=>b[1]-a[1]);
  T('Manœuvres',60,1040,'800 32px Montserrat, Arial, sans-serif','#22416D');
  T(mans.length?mans.map(([m,n])=>`${m} ×${n}`).join('   '):'Aucune manœuvre notée',60,1085,'400 27px Arial, sans-serif','#1C2B40');
  T('Derniers trajets',60,1160,'800 32px Montserrat, Arial, sans-serif','#22416D');
  const last=[...C.trips].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
  last.forEach((t,i)=>{const y=1205+i*44;T(frDate(t.date),60,y,'700 26px Arial, sans-serif','#1C2B40');T(`${nkm(t.km)} km`,260,y,'800 26px Arial, sans-serif','#1C2B40');if(t.note)T('★'.repeat(t.note),380,y,'400 24px Arial, sans-serif','#E0A12E');
    T([(t.routes||[]).map(r=>(ROUTES.find(q=>q[0]===r)||[,''])[1].replace(' / autoroute','')).join(', '),t.acc].filter(Boolean).join(' · ').slice(0,40),530,y,'400 25px Arial, sans-serif','#5A6B7C')});
  if(!last.length)T('Aucun trajet pour l’instant',60,1205,'400 26px Arial, sans-serif','#5A6B7C');
  T(`Envoyé le ${frDate(todayISO())}`,W-60,H-40,'400 24px Arial, sans-serif','#5A6B7C','right');
  return c}
const slug=()=>[C.profil.prenom,C.profil.nom].filter(Boolean).join('-').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'eleve';
const dataFile=()=>new File([JSON.stringify({app:'rc-carnet',v:1,exportedAt:Date.now(),profil:C.profil,trips:C.trips})],`carnet-${slug()}-${todayISO()}.txt`,{type:'text/plain'});
function dl(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function send(btn){const lab=btn.textContent;btn.disabled=true;btn.textContent='Préparation…';
  try{const c=await summaryCanvas(),blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9)),img=new File([blob],`carnet-${slug()}-${todayISO()}.jpg`,{type:'image/jpeg'}),data=dataFile();
    const s=stats(),text=`Bonjour Fabien, voici mon carnet de route : ${nkm(s.km)} km en ${s.n} trajet${s.n>1?'s':''}. ${C.profil.prenom||''}`.trim();
    const both=[img,data];
    if(navigator.canShare&&navigator.canShare({files:both})){try{await navigator.share({files:both,title:'Carnet de route',text});toast('Carnet envoyé')}catch(e){if(!(e&&e.name==='AbortError'))toast('Partage impossible ici')}}
    else if(navigator.canShare&&navigator.canShare({files:[img]})){try{await navigator.share({files:[img],title:'Carnet de route',text});dl(data);toast('Image envoyée, fichier téléchargé : envoyez-le aussi à votre moniteur')}catch(e){if(!(e&&e.name==='AbortError'))toast('Partage impossible ici')}}
    else{dl(img);setTimeout(()=>dl(data),500);toast('Image et fichier téléchargés : envoyez-les à votre moniteur')}}
  catch(e){toast('Impossible de préparer le récapitulatif')}finally{btn.disabled=false;btn.textContent=lab}}
async function backup(){const f=new File([JSON.stringify({app:'rc-carnet',v:1,backup:true,exportedAt:Date.now(),profil:C.profil,trips:C.trips})],`sauvegarde-carnet-${slug()}-${todayISO()}.txt`,{type:'text/plain'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde du carnet de route'});toast('Sauvegarde envoyée');return}}catch(e){if(e&&e.name==='AbortError')return}
  dl(f);toast('Sauvegarde téléchargée')}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='rc-carnet'||!Array.isArray(d.trips))throw 0;
    if(C&&C.trips.length&&!confirm('Remplacer le carnet de ce téléphone par la sauvegarde ?'))return;
    C={v:1,profil:d.profil,trips:d.trips};save();render();toast(`Carnet restauré : ${d.trips.length} trajet${d.trips.length>1?'s':''}`)}
  catch(e){toast('Fichier non reconnu')}}

/* ---------- événements ---------- */
$('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const sg=b.closest('[data-seg]');if(sg){sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(sg.dataset.seg==='formule'){const o=$('#setupF [name=objectif]');if(o&&(!o.value||o.value==='3000'))o.value=b.dataset.v==='aac'?3000:''}return}
  if(b.dataset.trip){tripSheet(b.dataset.trip);return}
  if(b.dataset.send!=null){send(b);return}
  if(b.dataset.backup!=null){backup();return}
  if(b.dataset.restore!=null){$('#restoreF').click();return}
  if(b.dataset.back!=null){render();return}});
$('#view').addEventListener('change',e=>{if(e.target.id==='restoreF'&&e.target.files[0]){restore(e.target.files[0]);e.target.value=''}});
$('#view').addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=n=>f.querySelector(`[name=${n}]`).value.trim();
  if(!v('prenom')){toast('Indiquez au moins votre prénom');return}
  const qp=new URLSearchParams(location.search),fo=(f.querySelector('[data-seg=formule] [aria-pressed=true]')||{}).dataset;
  const prof={prenom:v('prenom'),nom:v('nom'),formule:fo?fo.v:'aac',debut:v('debut')||todayISO(),objectif:+v('objectif')||0,
    accomp:v('accomp').split(',').map(s=>s.trim()).filter(Boolean),eleveId:(C&&C.profil.eleveId)||qp.get('e')||null};
  if(!C)C={v:1,profil:prof,trips:[]};else C.profil=prof;save();
  if(location.search)history.replaceState(null,'',location.pathname);render();window.scrollTo(0,0);toast('Carnet prêt')});
$('#fab').onclick=()=>tripSheet(null);
$('#setBtn').onclick=()=>{setupView();window.scrollTo(0,0)};
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('carnet-sw.js',{scope:'./carnet'}).catch(()=>{}));
})();
</script>
</body>
</html>
