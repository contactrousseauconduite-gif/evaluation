<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22416D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Examen blanc | Rousseau Conduite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5;--surface:#FFFFFF;--ink:#1C2B40;--muted:#5A6B7C;--line:#D2DDE3;--chip:#E2EBEF;
  --navy:#22416D;--navy-ink:#FFFFFF;--teal:#2A9DAE;--green:#8CC89F;--tealtext:#23798A;
  --F:#C9573C;--S:#2A8FA0;--B:#3E9A62;
  --display:"Montserrat","Segoe UI",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}}
:root[data-theme="dark"]{
  --bg:#101A26;--surface:#172536;--ink:#E4ECF2;--muted:#98A9B8;--line:#2A3B4E;--chip:#213247;
  --navy:#2D5A94;--tealtext:#5CC3D2;--F:#E0714F;--S:#3AAFC0;--B:#55B57A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--green))}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:1rem;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b{color:#fff}}
:root[data-theme="dark"] .brand b{color:#fff}
.brand span{font-size:.82rem;color:var(--tealtext);font-weight:700}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.block h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:10px;line-height:1.2;color:var(--ink)}
.block h2 .n{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-size:.85rem;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f,.lab{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:700}
.lab{margin:0 0 6px}
input[type=text],input[type=date],input[type=tel],input[type=number],textarea{
  width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:1rem;color:var(--ink)}
.group{margin-top:14px}
.group:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:.9rem;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.seg.multi button[aria-pressed="true"]::before{content:"✓ "}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row .q{font-weight:700}
.row .seg{flex:none;flex-wrap:nowrap}

.checks button{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;font-size:.95rem}
.checks button:first-child{border-top:0;padding-top:0}
.checks.att{padding:10px 0}.checks.att+.checks.att{border-top:2px solid var(--line)}.checks.att .box{border-radius:50%}
.checks .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.95rem}
.checks button[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}
.checks button[aria-pressed="true"] .box::before{content:"✓"}

.legend{font-size:.8rem;color:var(--muted);margin:-6px 0 10px}
.group .legend{margin:-2px 0 8px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
details.help{font-size:.84rem;color:var(--muted);margin:-4px 0 8px}
details.help summary{cursor:pointer;color:var(--tealtext);font-weight:700;width:max-content}
details.help ul{margin:6px 0 0;padding-left:0;list-style:none}
details.help li{margin:3px 0}
details.help li b{display:inline-block;min-width:1.8rem;color:var(--ink)}
.block h2 .part{margin-left:auto;font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--tealtext);white-space:nowrap}
.cat{font-weight:700;margin-top:8px;color:var(--green)}
.fsb{display:grid;grid-template-columns:repeat(3,48px);gap:6px;flex:none}
.fsb button{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-family:var(--display);font-weight:700;cursor:pointer}
.fsb button[aria-pressed="true"]{color:#fff;border-color:transparent}
.fsb button[data-v="F"][aria-pressed="true"],.fsb button[data-v="F2"][aria-pressed="true"]{background:var(--F)}
.fsb button[data-v="F1"][aria-pressed="true"]{background:#C98A1E}
.fsb button[data-v="F3"][aria-pressed="true"]{background:#9E3324}
.fsb4{grid-template-columns:repeat(4,48px)}
.fsb button[data-v="S"][aria-pressed="true"]{background:var(--S)}
.fsb button[data-v="B"][aria-pressed="true"]{background:var(--B)}

/* Panneau résultat */
.sign{background:var(--navy);color:#fff;border-radius:16px;padding:6px;margin:0 0 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sign{background:#22416D}}
:root[data-theme="dark"] .sign{background:#22416D}
.sign-in{border:3px solid #fff;border-radius:11px;padding:14px 14px 12px;text-align:center}
.sign h2{font-family:var(--display);font-weight:700;font-size:1rem;margin:0 0 10px;display:flex;justify-content:center;align-items:center;gap:8px}
.sign h2 .n{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;color:#22416D;font-size:.8rem}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.eq .c{display:flex;flex-direction:column;align-items:center;min-width:64px}
.eq .c small{font-size:.75rem;opacity:.85}
.eq .c b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.eq .op{font-family:var(--display);font-size:1.6rem;font-weight:700;opacity:.7;padding-bottom:4px}
.eq .c.final b{color:var(--green);font-size:2.4rem}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.prat .lbl{font-weight:700;font-size:.9rem;opacity:.92}
.hours{display:flex;align-items:center;justify-content:center;gap:18px;margin:2px 0}
.num{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:1.6rem;margin-left:3px}
.step{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;font-weight:700}
.step:disabled{opacity:.35;cursor:default}
.meta{font-size:.88rem;opacity:.95}
.reset{background:none;border:0;color:#fff;text-decoration:underline;font-size:.86rem;cursor:pointer;margin-top:4px}
.fine{font-size:.8rem;color:var(--muted);margin:6px 0 0;font-style:italic}

.pad-wrap{margin-top:12px}
.pad-head{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.pad-head button{background:none;border:0;color:var(--tealtext);font-weight:700;cursor:pointer;padding:4px}
canvas.pad{display:block;width:100%;height:130px;background:#fff;border:1px dashed #9AA9B6;border-radius:10px;touch-action:none}

details.bareme{margin-top:12px;font-size:.88rem;color:var(--muted)}
details.bareme summary{cursor:pointer;font-weight:700;color:var(--tealtext)}
details.bareme ul{margin:8px 0 0;padding-left:18px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 10px;font-weight:700;cursor:pointer;min-height:50px}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);grid-column:1/-1;font-size:1.05rem}
.btn.quiet{background:transparent}

.hist-empty{text-align:center;color:var(--muted);padding:40px 12px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.card .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:.85rem;color:var(--muted)}
.card .h{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--tealtext);min-width:3.2rem;text-align:right}
.card .del{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px 8px}
.src{font-size:.8rem;color:var(--muted);text-align:center;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.92rem;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (max-width:400px){.grid{grid-template-columns:1fr}.fsb{grid-template-columns:repeat(3,42px)}.row{align-items:flex-start;flex-direction:column}.row .fsb{align-self:stretch;grid-template-columns:repeat(3,1fr)}.row .fsb4{grid-template-columns:repeat(4,1fr)}}

.apps{max-width:760px;margin:0 auto;padding:6px 16px 8px;display:flex;gap:6px}
.apps a{flex:1;text-align:center;padding:7px 8px;border-radius:999px;font-weight:700;font-size:.86rem;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.apps a[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}

.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.lab .sub,.checks .sub{font-weight:400;color:var(--tealtext)}
.checks small{color:var(--muted);font-size:.82rem}
.top2{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.top2{grid-template-columns:1.1fr 1fr;gap:12px}.top2 .block{margin-bottom:12px}}
h2.pill{display:inline-flex;background:var(--chip);border-radius:999px;padding:5px 14px;font-size:.95rem;margin:0 0 12px}
.epreuve .dur{font-weight:700;margin:0 0 4px}.epreuve ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--ink)}.epreuve li{margin:3px 0}
.epreuve .min{color:var(--B);font-size:.82rem;font-weight:700;margin:8px 0 0}
.notation ul{list-style:none;margin:0;padding:0;font-size:.86rem}.notation li{display:flex;gap:10px;align-items:center;margin:6px 0}
.dot{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:.85rem}
h3.bilan{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:18px 2px 10px}
.block.comp{padding:0;overflow:hidden}
h2.band{margin:0;padding:12px 16px;background:var(--chip);font-size:1rem;display:flex;align-items:center;gap:10px}
.comp .item,.comp .checks{padding:12px 16px}.comp .item+.item{border-top:1px solid var(--line)}
.ihead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.ihead .q{font-weight:700;flex:1}
.inum{flex:none;font-family:var(--display);font-weight:800;font-size:.78rem;color:var(--tealtext);min-width:1.6rem}
.imax{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap}
.vchk{padding:0!important;margin-top:8px}.comp label.f{margin-bottom:4px}
:root{--cE:#E5484D;--c0:#F2A33A;--c1:#F8CB94;--c2:#FCE3A0;--c3:#5DAE5A}
.lvl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;max-width:420px}
.lvl button{height:48px;border-radius:10px;border:0;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;color:#1C2B40;opacity:.38;transition:opacity .15s,transform .15s}
.lvl button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.lvl button{transition:none}}
[data-c="E"]{background:var(--cE);color:#fff!important}[data-c="0"]{background:var(--c0);color:#1C2B40}[data-c="1"]{background:var(--c1);color:#1C2B40}
[data-c="2"]{background:var(--c2);color:#1C2B40}[data-c="3"]{background:var(--c3);color:#fff!important}
.seg button.e[aria-pressed="true"]{background:var(--cE);border-color:var(--cE);color:#fff}
.seg.res button[data-v="ok"][aria-pressed="true"]{background:var(--c3);border-color:var(--c3)}
.sign h2{justify-content:center}
.score{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 8px}
.score b{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-family:var(--display);font-weight:700;font-size:1.6rem;opacity:.8}
.track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.2)}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--green));width:0;transition:width .3s}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;transform:translateX(-50%)}
.trackl{position:relative;height:18px;font-size:.75rem;opacity:.85;margin-top:4px}
.trackl span{position:absolute;transform:translateX(-50%)}.trackl span:first-child{left:0;transform:none}.trackl span:last-child{right:0;left:auto;transform:none}
.subs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin:8px 0 2px}
.subs span{display:flex;align-items:baseline;gap:3px}.subs small{opacity:.8;font-size:.75rem}.subs b{font-family:var(--display);font-size:1.05rem}
.status{font-family:var(--display);font-weight:800;font-size:1.3rem;margin-top:8px}
.status.favorable{color:var(--green)}.status.insuffisant,.status.elim{color:#FF8A8F}.status.nonterm{color:#fff}
.card .h small{font-size:.8rem;opacity:.7;margin-left:2px}
.st.favorable{color:var(--B);font-weight:700}.st.insuffisant,.st.elim,.st.eliminatoire{color:var(--cE);font-weight:700}.st.nonterm{font-weight:700}

.bk{background:#FFF4D6;border:1px solid #E9B949;color:#4A3800;border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.checks .elimchips button{display:inline-flex;width:auto;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--bg);font-size:.9rem;min-height:40px}
.checks .elimchips button[aria-pressed="true"]{background:var(--cE);border-color:var(--cE);color:#fff;font-weight:700}
.bk-txt{display:flex;flex-direction:column;gap:2px;font-size:.9rem;flex:1 1 220px}
.bk-act{display:flex;gap:8px;flex-wrap:wrap}.bk .btn{min-height:42px;padding:9px 12px;font-size:.9rem}
.bk .btn[data-bk-now]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}.bk .btn.quiet{color:#4A3800;border-color:#E9B949}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root:not([data-theme="light"]) .bk .btn.quiet{color:#F7E3A6}}
:root[data-theme="dark"] .bk{background:#3A3113;color:#F7E3A6;border-color:#8A6D1F}:root[data-theme="dark"] .bk .btn.quiet{color:#F7E3A6}
.src small{display:block;margin-top:4px}
</style>
</head>

/* Rousseau Conduite : sauvegarde commune aux deux fiches */
window.RC=(function(){
  const K={ev:'rc-eval:history',ex:'rc-exam:history',last:'rc:lastBackup',snooze:'rc:backupSnooze'};
  const DAY=864e5,LIMIT=7;
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const list=k=>{try{return JSON.parse(get(k))||[]}catch(e){return[]}};
  const iso=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
  const fr=ts=>{const[y,m,d]=iso(ts).split('-');return `${d}/${m}/${y}`};
  let toast=()=>{};
  function saveFile(name,data){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  function status(){const n=list(K.ev).length+list(K.ex).length,last=+get(K.last)||0;
    return{n,last,days:last?Math.floor((Date.now()-last)/DAY):null}}
  function lastText(){const s=status();return s.last?`Dernière sauvegarde le ${fr(s.last)}.`:'Aucune sauvegarde faite pour l’instant.'}
  function backup(){const ev=list(K.ev),ex=list(K.ex);
    if(!ev.length&&!ex.length){toast('Aucune fiche à sauvegarder');return}
    saveFile(`sauvegarde-rousseau-conduite-${iso(Date.now())}.json`,JSON.stringify({app:'rousseau-conduite',v:3,date:Date.now(),evaluations:ev,examens:ex}));
    set(K.last,String(Date.now()));check();
    toast(`Sauvegarde téléchargée : ${ev.length} évaluation${ev.length>1?'s':''}, ${ex.length} examen${ex.length>1?'s':''} blanc${ex.length>1?'s':''}`)}
  function mergeInto(k,items,ver){const byId=Object.fromEntries(list(k).map(x=>[x.id,x]));let n=0;
    (items||[]).filter(x=>x&&x.id&&x.v===ver).forEach(x=>{n++;if(!byId[x.id]||(x.updatedAt||0)>(byId[x.id].updatedAt||0))byId[x.id]=x});
    if(n)set(k,JSON.stringify(Object.values(byId)));return n}
  async function restore(file){
    try{const d=JSON.parse(await file.text());const ev=mergeInto(K.ev,d.evaluations,2),ex=mergeInto(K.ex,d.examens,1);
      if(!ev&&!ex)throw 0;toast(`Restauré : ${ev} évaluation${ev>1?'s':''}, ${ex} examen${ex>1?'s':''} blanc${ex>1?'s':''}`);check();return true}
    catch(e){toast('Fichier de sauvegarde non reconnu');return false}}
  function check(){const el=document.getElementById('bkBanner');if(!el)return;const s=status();
    const due=s.n>0&&(!s.last||s.days>=LIMIT)&&Date.now()>(+get(K.snooze)||0);
    el.hidden=!due;
    if(due)el.querySelector('[data-bk-txt]').textContent=s.last?`Votre dernière sauvegarde date de ${s.days} jours.`:`Vous avez ${s.n} fiche${s.n>1?'s':''} enregistrée${s.n>1?'s':''} et aucune sauvegarde.`;
    document.querySelectorAll('[data-bk-last]').forEach(x=>x.textContent=lastText())}
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-bk-now]'))backup();
    if(e.target.closest('[data-bk-later]')){set(K.snooze,String(Date.now()+DAY));check()}
  });
  return{backup,restore,check,lastText,setToast:f=>{toast=f}};
})();
</script>

 {id:'route',t:'Appréhender la route',items:[

const AUTO=[['analyse','Analyse des situations','Diagnostic du contexte routier, l’élève peut être interrogé à l’oral'],
 ['adapt','Adaptation aux situations','Met en pratique son diagnostic'],
 ['autonome','Conduite autonome','Suit un itinéraire sans guidage, sans intervention du formateur']];
const VERIF=[['tech','Question technique (intérieure ou extérieure)'],['secu','Question de sécurité routière'],['secours','Question de premiers secours']];
const MANOEUVRES=['Marche arrière en ligne droite','Marche arrière en courbe','Rangement en créneau','Rangement en épi','Rangement en bataille','Demi-tour','Arrêt de précision'];

 ['0','0','Non acquis : la compétence n’est pas acquise, sans mise en danger'],
 ['1','1','Moyen : en cours d’acquisition, pas encore assez maîtrisée'],
 ['2','2','Bien : acquise, mais encore irrégulière'],
 ['3','3','Très bien : correctement exécutée, sans être forcément parfaite']];
const DEROULE=['Présentation de l’épreuve par l’examinateur','Installation au poste de conduite en sécurité',
 'Au moins 25 minutes de conduite effective, dont environ 5 minutes de conduite autonome sur un itinéraire indiqué',
 '2 manœuvres : la première imposée, la seconde au choix de l’élève',
 '3 questions de vérification : technique (intérieure ou extérieure), sécurité routière et premiers secours',
 'Points bonus : courtoisie envers les autres usagers et conduite économique'];
const ELIM=['Refus de priorité','Feu rouge non respecté','Stop non respecté','Franchissement de ligne continue','Circulation en sens interdit',
 'Dépassement dangereux','Excès de vitesse important','Contact avec un obstacle ou un usager','Mise en danger d’un piéton ou d’un cycliste','Intervention du formateur nécessaire'];
const LABEL={favorable:'Favorable',insuffisant:'Insuffisant',elim:'Insuffisant, erreur éliminatoire',nonterm:'Examen non mené à son terme',eliminatoire:'Insuffisant, erreur éliminatoire'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const newId=()=>'ex'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const frDate=iso=>{if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const fmt=n=>String(n).replace('.',',');
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a[k]=a[k]||{};a=a[k]});a[ks[ks.length-1]]=v};
function pro(){try{return JSON.parse(lsGet(LS_PRO))||{}}catch(e){return{}}}

function blank(){const p=pro();return{v:1,id:newId(),createdAt:Date.now(),updatedAt:Date.now(),
  nom:'',prenom:'',tel:'',date:todayISO(),numero:'',heures:'',lieu:'',boite:'manuelle',serie:'',
  inst:null,verif:{tech:false,secu:false,secours:false},crit:{},auto:{},bonus:{courtoisie:false,eco:false},
  man1:{type:null,res:null},man2:{type:null,res:null},elim:{on:false,texte:'',list:[]},nonTerm:false,
  forts:'',travail:'',formateur:p.formateur||'',autorisation:p.autorisation||'',sig:{formateur:null,eleve:null}}}
function normalize(o){const b=blank(),r=Object.assign(b,o||{});['verif','crit','auto','bonus','man1','man2','elim','sig'].forEach(k=>r[k]=Object.assign({},b[k],r[k]||{}));if(!Array.isArray(r.elim.list))r.elim.list=[];return r}
let S;try{S=JSON.parse(lsGet(LS_DRAFT))}catch(e){S=null}
S=(S&&S.v===1)?normalize(S):blank();

/* ---------- calcul ---------- */
const verifN=()=>VERIF.filter(([k])=>S.verif[k]).length;
function itemScore(it){if(it.kind==='inst')return S.inst;if(it.kind==='verif')return verifN();return S.crit[it.k]}
function compute(){
  let total=0,ans=0,tot=0,hasE=false;const sub={};
  BLOCKS.forEach(b=>{let s=0,e=false;b.items.forEach(it=>{const v=itemScore(it);
    if(it.kind!=='verif')tot++;
    if(v!=null){if(it.kind!=='verif')ans++;if(v==='E'){hasE=true;e=true}else s+=v}});sub[b.id]={s,e};total+=s});
  let a=0,aa=false;AUTO.forEach(([k])=>{tot++;const v=S.auto[k];if(v!=null){ans++;aa=true;a+=v}});sub.auto={s:a,any:aa};total+=a;
  const bo=(S.bonus.courtoisie?1:0)+(S.bonus.eco?1:0);sub.bonus={s:bo};total+=bo;
  ['man1','man2'].forEach(m=>{tot++;if(S[m].res){ans++;if(S[m].res==='E')hasE=true}});
  if(S.elim.on)hasE=true;
  const complete=ans===tot;
  const status=S.nonTerm?'nonterm':hasE?'elim':total>=SEUIL?'favorable':'insuffisant';
  return{total,ans,tot,hasE,complete,status,sub};
}

/* ---------- rendu ---------- */
const inp=(k,l,type='text',cls='',extra='')=>`<label class="f ${cls}">${l}<input type="${type}" data-in="${k}" value="${esc(getP(S,k))}" ${extra}></label>`;

const lvl=(path,opts)=>`<div class="lvl" data-single="${path}" style="--n:${opts.length}">${opts.map(([v,l,c])=>`<button type="button" data-v="${v}" data-c="${c}" aria-pressed="${String(getP(S,path))===String(v)}">${l}</button>`).join('')}</div>`;
const L_E0123=[['E','E','E'],[0,'0','0'],[1,'1','1'],[2,'2','2'],[3,'3','3']];
const L_INST=[[0,'0','0'],[1,'1','2'],[2,'2','3']];
const L_AUTO=[[0,'0','0'],[0.5,'0,5','2'],[1,'1','3']];
const hint=t=>`<p class="hint">${t}</p>`;
const pad=(k,l)=>`<div class="pad-wrap"><div class="pad-head"><span>${l}</span><button type="button" data-clear="${k}">Effacer</button></div><canvas class="pad" data-pad="${k}"></canvas></div>`;
const man=(m,title,sub)=>`<div class="group"><div class="lab">${title} <span class="sub">${sub}</span></div>
  <div class="seg" data-single="${m}.type">${MANOEUVRES.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${S[m].type===o}">${esc(o)}</button>`).join('')}</div>
  <div class="seg res" data-single="${m}.res" style="margin-top:8px"><button type="button" data-v="ok" aria-pressed="${S[m].res==='ok'}">Réussie</button><button type="button" data-v="E" class="e" aria-pressed="${S[m].res==='E'}">Éliminatoire</button></div></div>`;
function itemRow(it){
  let ctrl;
  if(it.kind==='inst')ctrl=lvl('inst',L_INST);
  else if(it.kind==='verif')ctrl=`<div class="checks vchk">${VERIF.map(([k,l])=>`<button type="button" data-toggle="verif.${k}" aria-pressed="${S.verif[k]}"><span class="box"></span><span>${l} <span class="sub">+1</span></span></button>`).join('')}</div>`;
  else ctrl=lvl('crit.'+it.k,L_E0123);
  return `<div class="item"><div class="ihead"><span class="inum">${it.n}</span><span class="q">${it.l}</span><span class="imax" data-part="i.${it.k}"></span></div>
    ${it.kind==='verif'?inp('serie','N° de série (2 derniers chiffres du compteur)','text','','inputmode="numeric" maxlength="2"'):''}
    ${ctrl}${hint(it.h)}</div>`;
}

function renderForm(){
  $('#viewForm').innerHTML=`
  <div class="top2">

    ${inp('nom','Nom','text','','autocomplete="off"')}${inp('prenom','Prénom','text','','autocomplete="off"')}

function updateDerived(){
  const c=compute();
  $('#rTot').textContent=fmt(c.total);
  $('#meter').style.width=Math.min(100,c.total/MAX*100)+'%';
  const st=$('#rStat');st.className='status '+c.status;
  const started=c.ans>0||c.hasE||S.nonTerm||verifN()>0;
  st.textContent=started?LABEL[c.status]+(!c.complete&&c.status!=='elim'&&c.status!=='nonterm'?' (provisoire)':''):'';
  const left=c.tot-c.ans;
  $('#meta').innerHTML=c.status==='nonterm'?'Examen interrompu avant la fin':c.hasE?'Erreur éliminatoire : échec, quel que soit le total':
    (!started?'Notez les compétences au fil du parcours':
    (c.total>=SEUIL?'Seuil de 20 points atteint':`Encore ${fmt(SEUIL-c.total)} point${SEUIL-c.total>1?'s':''} pour atteindre 20`)+(left?`<br>${left} élément${left>1?'s':''} à renseigner`:''));
  const set=(k,t)=>{const el=document.querySelector(`[data-part="${k}"]`);if(el)el.textContent=t};
  BLOCKS.forEach(b=>{const mx=b.items.reduce((s,i)=>s+i.max,0);set('b.'+b.id,c.sub[b.id].e?`${fmt(c.sub[b.id].s)} / ${mx}, E`:`${fmt(c.sub[b.id].s)} / ${mx}`);
    b.items.forEach(it=>{const v=itemScore(it);set('i.'+it.k,v==null?`/ ${it.max}`:v==='E'?'E':`${fmt(v)} / ${it.max}`)})});
  set('b.auto',`${fmt(c.sub.auto.s)} / 3`);AUTO.forEach(([k])=>set('a.'+k,S.auto[k]==null?'/ 1':`${fmt(S.auto[k])} / 1`));
  set('b.bonus',`${c.sub.bonus.s} / 2`);
  $('#rSubs').innerHTML=[['Véhicule',c.sub.veh.s,8],['Route',c.sub.route.s,9],['Partage',c.sub.partage.s,9],['Autonomie',c.sub.auto.s,3],['Bonus',c.sub.bonus.s,2]]
    .map(([l,s,m])=>`<span><small>${l}</small><b>${fmt(s)}</b><small>/${m}</small></span>`).join('');
}

/* ---------- signatures ---------- */
function initPad(cv){
  const key=cv.dataset.pad,ctx=cv.getContext('2d');let drawing=false,last=null;
  function size(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2.4;ctx.strokeStyle='#1C2B40'}
  cv._redraw=function(){size();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    if(S.sig[key]){const img=new Image();img.onload=()=>{const r=cv.getBoundingClientRect();ctx.drawImage(img,0,0,r.width,r.height)};img.src=S.sig[key]}};
  cv._redraw();
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,Math.PI*2);ctx.fillStyle='#1C2B40';ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;S.sig[key]=cv.toDataURL('image/png');touch()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>document.querySelectorAll('canvas.pad').forEach(c=>c._redraw&&c._redraw()),200)});

  save(ev){const l=this.list().filter(x=>x.id!==ev.id);l.push(ev);lsSet(LS_HIST,JSON.stringify(l));history=l;renderHist()},
  remove(id){const l=this.list().filter(x=>x.id!==id);lsSet(LS_HIST,JSON.stringify(l));history=l;renderHist()}};
function isSaved(){const h=history.find(x=>x.id===S.id);return h&&h.updatedAt===S.updatedAt}
function saveCurrent(){
  if(!S.prenom&&!S.nom){toast('Ajoutez au moins le nom de l’élève');document.querySelector('[data-in="nom"]').focus();return}
  const c=compute();S.result={total:c.total,status:c.status,complete:c.complete};S.updatedAt=Date.now();lsSet(LS_DRAFT,JSON.stringify(S));
  try{store.save(JSON.parse(JSON.stringify(S)));toast('Examen blanc enregistré');RC.check()}catch(e){toast('Stockage plein : supprimez d’anciens examens')}
}

$('#viewHist').addEventListener('click',e=>{

  if(o){const ev=history.find(x=>x.id===o.dataset.open);if(!ev)return;S=normalize(JSON.parse(JSON.stringify(ev)));lsSet(LS_DRAFT,JSON.stringify(S));show('form');renderForm();window.scrollTo(0,0)}
  if(d){const ev=history.find(x=>x.id===d.dataset.del);if(!confirm(`Supprimer l’examen blanc de ${[ev?.prenom,ev?.nom].filter(Boolean).join(' ')||'cet élève'} ?`))return;store.remove(d.dataset.del);toast('Examen blanc supprimé')}

});
$('#viewHist').addEventListener('change',async e=>{
  if(e.target.id!=='restoreFile'||!e.target.files[0])return;

<div><div class="box info"><h2>Informations</h2><div><b>Date :</b> ${esc(frDate(S.date))}</div><div><b>Élève :</b> ${esc(nomComplet())}</div>
<div><b>Enseignant :</b> ${esc(S.formateur)}</div><div><b>Examen n° :</b> ${esc(S.numero||'–')} &nbsp; <b style="min-width:0">Heures :</b> ${esc(S.heures||'–')}</div><div><b>Boîte :</b> ${esc(S.boite)}</div></div>
<div class="box resu"><h2>Résultat de l’examen blanc</h2><div class="f">${ck(c.status==='favorable')} Favorable</div><div class="i">${ck(c.status==='insuffisant'||c.status==='elim')} Insuffisant${c.status==='elim'?' (erreur éliminatoire)':''}</div><div>${ck(c.status==='nonterm')} Examen non mené à son terme</div></div></div>
</div>
<div class="box"><h2>Observations</h2><p style="margin:2px 0;min-height:28px">${esc(S.forts)||'&nbsp;'}</p>${S.travail?`<p style="margin:4px 0 0"><b>Axes de travail :</b> ${esc(S.travail)}</p>`:''}</div>
<table class="grid"><tr><th style="text-align:left;font-size:14px">Bilan des compétences</th>${cols.map(col=>`<th class="c${col}">${col}</th>`).join('')}<th>Note</th></tr>${blocks}
<tr class="band"><td colspan="7">Autonomie et conscience du risque</td></tr>
<tr><td class="lbl" style="color:#5A6B7C;font-size:10.5px">Notée 0, 0,5 ou 1 par sous-critère</td><td class="lv na"></td><td class="lv na" style="font-size:10px;opacity:1">0</td><td class="lv na"></td><td class="lv na" style="font-size:10px;opacity:1">0,5</td><td class="lv na" style="font-size:10px;opacity:1">1</td><td class="nt"></td></tr>
${autoRows.replace(/<tr><td class="lbl">(.*?)<\/td>(<td class="lv c0.*?<\/td>)(<td class="lv c2.*?<\/td>)(<td class="lv c3.*?<\/td>)/g,'<tr><td class="lbl">$1</td><td class="lv na"></td>$2<td class="lv na"></td>$3$4')}
<tr class="band"><td colspan="7">Points bonus</td></tr>
<tr><td class="lbl" colspan="6">Conduite économique et respectueuse de l’environnement &nbsp; ${ck(S.bonus.eco)}</td><td class="nt">${S.bonus.eco?1:0}<small>/1</small></td></tr>
<tr><td class="lbl" colspan="6">Courtoisie &nbsp; ${ck(S.bonus.courtoisie)}</td><td class="nt">${S.bonus.courtoisie?1:0}<small>/1</small></td></tr>
</table>
<div class="tot">Sous-totaux : véhicule ${fmt(c.sub.veh.s)}/8, route ${fmt(c.sub.route.s)}/9, partage ${fmt(c.sub.partage.s)}/9, autonomie ${fmt(c.sub.auto.s)}/3, bonus ${c.sub.bonus.s}/2 <span>Total général : ${fmt(c.total)} / 31</span></div>
<div class="cols2"><div class="box"><h2>Manœuvres</h2><div>1 (imposée) : ${esc(manTxt('man1'))}</div><div>2 (au choix) : ${esc(manTxt('man2'))}</div>${S.elim.on?`<div style="margin-top:4px;color:#D6424A"><b>Erreur éliminatoire :</b> ${esc(elimTxt()||'oui')}</div>`:''}</div>
<div class="box"><h2>La notation</h2><ul class="legend">${NOTATION.map(([col,,t])=>`<li><span class="dot" style="background:${{E:'#E5484D','0':'#F2A33A','1':'#F8CB94','2':'#FCE3A0','3':'#5DAE5A'}[col]}"></span>${t}</li>`).join('')}</ul></div></div>
<div class="sigs"><div>Signature enseignant${sig('formateur')}</div><div>Signature élève${sig('eleve')}</div></div>
</body></html>`}
function saveFile(filename,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function printFiche(){const url=URL.createObjectURL(new Blob([ficheHTML(true)],{type:'text/html'}));
  const w=window.open(url,'_blank');if(!w)toast('Autorisez les fenêtres pour imprimer');setTimeout(()=>URL.revokeObjectURL(url),60000)}
window.__fiche=()=>ficheHTML(false);

let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- démarrage ---------- */
RC.setToast(toast);history=store.list();renderForm();renderHist();RC.check();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
